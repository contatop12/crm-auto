<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P12 CRM Auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f2f4f6;
        --panel: #ffffff;
        --ink: #14181d;
        --ink-2: #5a646e;
        --ink-3: #98a2ac;
        --rule: #dde3e8;

        --pass: #1f7a5c;
        --halt: #b23a2e;
        --hold: #a9761b;
        --idle: #c3cad1;

        --ui: 'Archivo', ui-sans-serif, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--ui);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- estrutura ---------- */
      .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 28px 0 20px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      header .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-left: auto; }

      button {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover { color: var(--ink); border-color: var(--ink-3); }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      /* ---------- trilha: a marca da tela ---------- */
      .cliente {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 18px 20px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }
      .cliente:hover { border-color: var(--ink-3); }
      .cliente:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .cliente-topo { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
      .cliente-nome { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
      .cliente-slug { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
      .cliente-sinal { margin-left: auto; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .sinal-ok { color: var(--pass); }
      .sinal-erro { color: var(--halt); }
      .sinal-silencio { color: var(--ink-3); }

      /* cada traço é um evento; mais recente à direita */
      .trilha { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-bottom: 12px; }
      .tick { width: 5px; border-radius: 1px; background: var(--idle); }
      .tick-ok { background: var(--pass); height: 16px; }
      .tick-ignorado { background: var(--hold); height: 11px; }
      .tick-erro { background: var(--halt); height: 26px; }
      .tick-recebido { background: var(--idle); height: 8px; }
      .trilha-vazia { font-family: var(--mono); font-size: 12px; color: var(--ink-3); align-self: center; }

      @media (prefers-reduced-motion: no-preference) {
        .tick { animation: surgir .18s ease-out backwards; }
        @keyframes surgir { from { transform: scaleY(.2); opacity: 0; } }
      }

      .cliente-stats { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
      .cliente-stats b { font-weight: 500; color: var(--ink); }
      .cliente-erro { color: var(--halt); }

      /* ---------- detalhe ---------- */
      .voltar { margin-bottom: 20px; }

      section { margin-bottom: 32px; }
      section > h2 {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--ink-3);
        margin: 0 0 12px;
      }

      .checagem {
        display: flex;
        gap: 12px;
        padding: 9px 14px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-top: none;
        font-size: 14px;
      }
      .checagem:first-of-type { border-top: 1px solid var(--rule); border-radius: 4px 4px 0 0; }
      .checagem:last-of-type { border-radius: 0 0 4px 4px; }
      .checagem-marca { font-family: var(--mono); font-size: 11px; width: 52px; flex: none; padding-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
      .marca-ok { color: var(--pass); }
      .marca-erro { color: var(--halt); }
      .marca-aviso { color: var(--hold); }
      .marca-na { color: var(--ink-3); }
      .checagem-titulo { font-weight: 500; flex: none; width: 200px; }
      .checagem-detalhe { font-family: var(--mono); font-size: 12px; color: var(--ink-2); word-break: break-word; }

      table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; }
      th {
        font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .08em; color: var(--ink-3); text-align: left;
        padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap;
      }
      td { padding: 9px 12px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      tr.clicavel { cursor: pointer; }
      tr.clicavel:hover td { background: var(--paper); }
      .st-ok { color: var(--pass); }
      .st-erro { color: var(--halt); }
      .st-ignorado { color: var(--hold); }
      .st-recebido { color: var(--ink-3); }
      .motivo { color: var(--ink-2); }

      pre {
        font-family: var(--mono); font-size: 12px; line-height: 1.55;
        background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
        padding: 14px; overflow-x: auto; margin: 0; max-height: 460px;
      }

      .aviso {
        font-family: var(--mono); font-size: 12px; color: var(--ink-2);
        background: var(--panel); border: 1px solid var(--rule); border-left: 2px solid var(--hold);
        border-radius: 3px; padding: 10px 14px; margin-bottom: 16px;
      }

      .vazio {
        background: var(--panel); border: 1px dashed var(--rule); border-radius: 4px;
        padding: 40px 24px; text-align: center; color: var(--ink-2);
      }
      .vazio p { margin: 0 0 6px; }
      .vazio .mono { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

      .linha-acoes { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      .carregando { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

      /* ---------- formulario ---------- */
      .campo { margin-bottom: 14px; }
      .campo label {
        display: block; font-family: var(--mono); font-size: 11px;
        text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 5px;
      }
      .campo .dica { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 4px; }
      input, select {
        width: 100%; font-family: var(--mono); font-size: 13px; color: var(--ink);
        background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; padding: 7px 9px;
      }
      input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: -1px; border-color: var(--ink); }
      input[type=checkbox] { width: auto; }
      .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .erro {
        font-family: var(--mono); font-size: 12px; color: var(--halt);
        background: var(--panel); border: 1px solid var(--rule); border-left: 2px solid var(--halt);
        border-radius: 3px; padding: 10px 14px; margin-bottom: 14px;
      }
      .principal { color: var(--panel); background: var(--ink); border-color: var(--ink); }
      .principal:hover { color: var(--panel); background: #000; }
      td input, td select { padding: 4px 6px; font-size: 12px; }

      @media (max-width: 700px) {
        .grade { grid-template-columns: 1fr; }
        .checagem { flex-wrap: wrap; }
        .checagem-titulo { width: auto; }
        .esconder-mobile { display: none; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <h1>P12 CRM Auto</h1>
        <button id="btn-atualizar">Atualizar</button>
        <button id="btn-novo">Adicionar cliente</button>
        <span class="meta" id="rodape"></span>
      </header>
      <main id="tela"><p class="carregando">Carregando…</p></main>
    </div>

    <script>
      const tela = document.getElementById('tela');
      const rodape = document.getElementById('rodape');

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      async function api(caminho) {
        const r = await fetch('/api' + caminho);
        if (r.status === 401) throw new Error('sem-acesso');
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
        return r.json();
      }

      function haQuanto(iso) {
        if (!iso) return 'nunca';
        const seg = (Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime()) / 1000;
        if (seg < 90) return 'há instantes';
        if (seg < 5400) return 'há ' + Math.round(seg / 60) + ' min';
        if (seg < 172800) return 'há ' + Math.round(seg / 3600) + ' h';
        return 'há ' + Math.round(seg / 86400) + ' dias';
      }

      const hora = (iso) =>
        !iso ? '' : new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });

      // ---------- lista de clientes ----------
      async function verOverview() {
        tela.innerHTML = '<p class="carregando">Carregando clientes…</p>';
        const clientes = await api('/overview');

        if (!clientes.length) {
          tela.innerHTML = `
            <div class="vazio">
              <p>Nenhum cliente cadastrado ainda.</p>
              <p class="mono">Cadastre o primeiro para começar a receber webhooks.</p>
            </div>`;
          rodape.textContent = 'nenhum cliente';
          return;
        }

        // busca a trilha de cada cliente em paralelo
        const trilhas = await Promise.all(
          clientes.map((c) => api('/tenants/' + c.tenant_id + '/events?limit=40').catch(() => [])),
        );

        tela.innerHTML = clientes
          .map((c, i) => {
            // eventos vêm do mais novo para o mais velho; a trilha lê ao contrário
            const ticks = trilhas[i]
              .slice()
              .reverse()
              .map(
                (e, j) =>
                  `<span class="tick tick-${esc(e.status)}" style="animation-delay:${j * 8}ms" title="${esc(
                    e.event_type,
                  )} · ${esc(e.status)}${e.motivo ? ' · ' + esc(e.motivo) : ''}"></span>`,
              )
              .join('');

            const rotulo = { ok: 'operando', erro: 'com erro', silencio: 'sem eventos' }[c.sinal];

            return `
            <button class="cliente" data-id="${c.tenant_id}">
              <div class="cliente-topo">
                <span class="cliente-nome">${esc(c.nome)}</span>
                <span class="cliente-slug">${esc(c.slug)}</span>
                <span class="cliente-sinal sinal-${c.sinal}">${rotulo}</span>
              </div>
              <div class="trilha">${ticks || '<span class="trilha-vazia">sem eventos registrados</span>'}</div>
              <div class="cliente-stats">
                <b>${c.recebidos_24h}</b> em 24h · <b>${c.erros_24h}</b> ${
                  c.erros_24h === 1 ? 'erro' : 'erros'
                } · <b>${c.leads}</b> leads · <b>${c.conversoes_enviadas}</b> conversões
                · último evento ${haQuanto(c.ultimo_evento_em)}
                ${c.ultimo_erro_motivo ? `<br><span class="cliente-erro">último erro: ${esc(c.ultimo_erro_motivo)}</span>` : ''}
              </div>
            </button>`;
          })
          .join('');

        tela.querySelectorAll('.cliente').forEach((el) =>
          el.addEventListener('click', () => verCliente(el.dataset.id)),
        );
        rodape.textContent = clientes.length + ' clientes · ' + new Date().toLocaleTimeString('pt-BR');
      }

      // ---------- detalhe de um cliente ----------
      async function verCliente(id) {
        tela.innerHTML = '<p class="carregando">Carregando…</p>';
        const [cliente] = (await api('/overview')).filter((c) => String(c.tenant_id) === String(id));
        const eventos = await api('/tenants/' + id + '/events?limit=60');

        tela.innerHTML = `
          <div class="voltar"><button id="btn-voltar">← Todos os clientes</button></div>
          <h2 style="font-family:var(--ui);font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em">
            ${esc(cliente ? cliente.nome : 'Cliente ' + id)}
          </h2>
          <p class="cliente-slug" style="margin:0 0 28px">${esc(cliente ? cliente.slug : '')}</p>

          <section>
            <h2>Fluxo do lead</h2>
            <div id="fluxo"></div>
          </section>

          <section>
            <h2>Integrações</h2>
            <div class="linha-acoes">
              <button id="btn-checar">Checar agora</button>
              <span class="carregando" id="checagem-estado">consulta Chatwoot, Google Ads, etiquetas e WhatsApp ao vivo</span>
            </div>
            <div id="checagens"></div>
          </section>

          <section>
            <h2>Etapas do funil</h2>
            <div class="linha-acoes">
              <button id="btn-sync">Sincronizar do board</button>
              <span class="carregando" id="etapas-estado"></span>
            </div>
            <div id="etapas"></div>
          </section>

          <section>
            <h2>Metas de conversão no Google Ads</h2>
            <div class="linha-acoes">
              <button id="btn-metas">Gerar metas</button>
              <span class="carregando" id="metas-estado">propõe a partir das etapas e mostra antes de publicar</span>
            </div>
            <div id="metas"></div>
          </section>

          <section>
            <h2>Webhooks no Chatwoot</h2>
            <div class="linha-acoes">
              <button id="btn-webhook">Registrar webhook do painel</button>
              <span class="carregando" id="webhook-estado"></span>
            </div>
            <div id="webhooks"></div>
          </section>

          <section>
            <h2>Avisos de lead novo no grupo</h2>
            <div id="avisos"></div>
          </section>

          <section>
            <h2>Últimos webhooks recebidos</h2>
            ${
              eventos.length
                ? `<table>
                    <thead><tr>
                      <th>Quando</th><th>Origem</th><th>Evento</th><th>Status</th>
                      <th class="esconder-mobile">Motivo</th><th>Assin.</th>
                    </tr></thead>
                    <tbody>${eventos
                      .map(
                        (e) => `
                      <tr class="clicavel" data-ev="${e.id}">
                        <td title="${esc(hora(e.received_at))}">${haQuanto(e.received_at)}</td>
                        <td>${esc(e.source)}</td>
                        <td>${esc(e.event_type)}</td>
                        <td class="st-${esc(e.status)}">${esc(e.status)}</td>
                        <td class="motivo esconder-mobile">${esc(e.motivo || '')}</td>
                        <td>${e.signature_ok === null ? '—' : e.signature_ok ? 'ok' : 'falhou'}</td>
                      </tr>`,
                      )
                      .join('')}</tbody>
                  </table>
                  <p class="carregando" style="margin-top:10px">Clique numa linha para ver o corpo do webhook.</p>`
                : `<div class="vazio">
                     <p>Nenhum webhook recebido deste cliente.</p>
                     <p class="mono">Confira em Integrações se o webhook está registrado apontando para este Worker.</p>
                   </div>`
            }
          </section>

          <section id="secao-payload" hidden>
            <h2>Corpo do webhook</h2>
            <div class="aviso" id="payload-aviso"></div>
            <div class="linha-acoes"><button id="btn-revelar">Revelar dados originais</button></div>
            <pre id="payload"></pre>
          </section>`;

        document.getElementById('btn-voltar').addEventListener('click', verOverview);
        document.getElementById('btn-checar').addEventListener('click', () => checar(id));
        document.getElementById('btn-sync').addEventListener('click', () => sincronizarEtapas(id));
        document.getElementById('btn-metas').addEventListener('click', () => preverMetas(id));
        carregarFluxo(id);
        carregarEtapas(id);
        carregarWebhooks(id, cliente ? cliente.slug : '');
        carregarAvisos(id);
        tela.querySelectorAll('tr.clicavel').forEach((tr) =>
          tr.addEventListener('click', () => verPayload(id, tr.dataset.ev, false)),
        );
        rodape.textContent = eventos.length + ' eventos · ' + new Date().toLocaleTimeString('pt-BR');
      }

      // O Chatwoot posta sem seguir redirect. Se o Access ainda cobre /ingest,
      // registrar o webhook so faria ele bater numa pagina de login e perder o
      // evento — por isso a sondagem antes.
      async function ingestAlcancavel(slug) {
        try {
          const r = await fetch('/ingest/' + slug + '/chatwoot', { method: 'POST', body: '{}' });
          if (r.redirected || /cloudflareaccess\.com/.test(r.url)) return false;
          return true; // 401 (sem assinatura) já prova que a rota chegou no Worker
        } catch {
          return false;
        }
      }

      async function carregarAvisos(id) {
        const alvo = document.getElementById('avisos');
        let linhas;
        try {
          linhas = await api('/tenants/' + id + '/avisos');
        } catch (e) {
          alvo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
          return;
        }

        alvo.innerHTML = linhas.length
          ? `<table><thead><tr><th>Quando</th><th>Lead</th><th>Canal</th><th>Telefone</th><th>Status</th></tr></thead><tbody>${linhas
              .map(
                (l) => `<tr>
                  <td title="${esc(hora(l.created_at))}">${haQuanto(l.created_at)}</td>
                  <td>${esc(l.lead_nome || '')}</td>
                  <td class="motivo">${esc(l.canal || '')}</td>
                  <td class="motivo">${esc(l.telefone || '')}</td>
                  <td class="st-${l.status === 'enviado' ? 'ok' : l.status === 'erro' ? 'erro' : 'recebido'}">${esc(
                    l.status,
                  )}${l.erro ? ' · ' + esc(l.erro) : ''}</td>
                </tr>`,
              )
              .join('')}</tbody></table>`
          : `<div class="vazio">
               <p>Nenhum aviso enviado ainda.</p>
               <p class="mono">Dispara quando um card entra no board de Ads. Leads do Orgânico não avisam.</p>
             </div>`;
      }

      async function carregarWebhooks(id, slug) {
        const alvo = document.getElementById('webhooks');
        const estado = document.getElementById('webhook-estado');
        const botao = document.getElementById('btn-webhook');
        alvo.innerHTML = '<p class="carregando">carregando…</p>';

        let r;
        try {
          r = await api('/tenants/' + id + '/webhooks');
        } catch (e) {
          alvo.innerHTML = '';
          estado.textContent = 'falhou: ' + e.message;
          return;
        }

        const nosso = r.webhooks.find((w) => w.do_painel);

        alvo.innerHTML = r.webhooks.length
          ? `<table><thead><tr><th>Destino</th><th>Nome</th><th>Inscrições</th><th></th></tr></thead><tbody>${r.webhooks
              .map(
                (w) => `<tr>
                  <td>${esc(w.destino)}</td>
                  <td class="motivo">${esc(w.nome)}</td>
                  <td class="motivo">${esc(w.subscriptions.join(', '))}</td>
                  <td class="${w.do_painel ? 'st-ok' : 'st-recebido'}">${w.do_painel ? 'painel' : 'n8n'}</td>
                </tr>`,
              )
              .join('')}</tbody></table>`
          : '<div class="vazio"><p>Nenhum webhook registrado nesta conta.</p></div>';

        if (nosso) {
          botao.textContent = 'Remover webhook do painel';
          estado.textContent = 'o painel recebe eventos desta conta';
          botao.onclick = () => mudarWebhook(id, slug, 'DELETE');
        } else {
          botao.textContent = 'Registrar webhook do painel';
          estado.textContent = 'adiciona sem mexer nos do n8n';
          botao.onclick = () => mudarWebhook(id, slug, 'POST');
        }
      }

      async function mudarWebhook(id, slug, metodo) {
        const estado = document.getElementById('webhook-estado');
        const botao = document.getElementById('btn-webhook');
        botao.disabled = true;

        if (metodo === 'POST') {
          estado.textContent = 'conferindo se a rota de ingestão está pública…';
          if (!(await ingestAlcancavel(slug))) {
            estado.textContent =
              'a rota /ingest está atrás do Access — o Chatwoot receberia a tela de login. Crie um app do Access com política Bypass para o path ingest.';
            botao.disabled = false;
            return;
          }
        }

        estado.textContent = metodo === 'POST' ? 'registrando…' : 'removendo…';
        try {
          const r = await fetch('/api/tenants/' + id + '/webhook', { method: metodo });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
          await carregarWebhooks(id, slug);
          if (metodo === 'POST') {
            document.getElementById('webhook-estado').textContent =
              (j.adotado ? 'adotado o que já existia' : 'registrado') +
              ' · assinatura ' + j.assinatura +
              (j.aviso ? ' · ' + j.aviso : '');
          }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        } finally {
          botao.disabled = false;
        }
      }

      async function checar(id) {
        const estado = document.getElementById('checagem-estado');
        const alvo = document.getElementById('checagens');
        estado.textContent = 'consultando…';
        try {
          const r = await api('/tenants/' + id + '/health');
          alvo.innerHTML = r.checagens
            .map(
              (c) => `
              <div class="checagem">
                <span class="checagem-marca marca-${c.estado}">${c.estado === 'na' ? '—' : c.estado}</span>
                <span class="checagem-titulo">${esc(c.titulo)}</span>
                <span class="checagem-detalhe">${esc(c.detalhe)}</span>
              </div>`,
            )
            .join('');
          estado.textContent = `${r.resumo.erro} com erro · ${r.resumo.aviso} com aviso · ${r.resumo.ok} ok`;
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      async function verPayload(tenantId, eventId, revelar) {
        const secao = document.getElementById('secao-payload');
        const pre = document.getElementById('payload');
        const aviso = document.getElementById('payload-aviso');
        const botao = document.getElementById('btn-revelar');

        secao.hidden = false;
        pre.textContent = 'carregando…';
        secao.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const r = await api(
          '/tenants/' + tenantId + '/events/' + eventId + '/payload' + (revelar ? '?revelar=1' : ''),
        );

        pre.textContent = r.payload || '(vazio)';
        if (r.expirado) {
          aviso.textContent = r.motivo;
          botao.hidden = true;
        } else {
          aviso.textContent = r.mascarado
            ? 'Telefone, e-mail e texto das mensagens estão mascarados.'
            : 'Mostrando os dados originais do lead.';
          botao.hidden = false;
          botao.textContent = r.mascarado ? 'Revelar dados originais' : 'Voltar a mascarar';
          botao.onclick = () => verPayload(tenantId, eventId, !!r.mascarado);
        }
      }

      async function enviar(caminho, metodo, corpo) {
        const r = await fetch('/api' + caminho, {
          method: metodo,
          headers: { 'content-type': 'application/json' },
          body: corpo === undefined ? undefined : JSON.stringify(corpo),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
        return j;
      }

      function normalizarSlug(v) {
        return String(v || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function opcoes(lista, valorAtual) {
        return lista
          .map(function (o) { return '<option ' + (o === valorAtual ? 'selected' : '') + '>' + o + '</option>'; })
          .join('');
      }

      // ---------- cadastro de cliente ----------
      async function verFormulario() {
        tela.innerHTML = '<p class="carregando">carregando contas…</p>';
        rodape.textContent = '';

        let contasCw = [];
        let contasGa = [];
        try {
          contasCw = await api('/chatwoot/accounts');
          contasGa = await api('/google-ads/accounts').catch(function () { return []; });
        } catch (e) {
          tela.innerHTML =
            '<div class="vazio"><p>Não foi possível carregar as contas.</p><p class="mono">' +
            esc(e.message) + '</p></div>';
          return;
        }

        const optCw = contasCw
          .map(function (a) { return '<option value="' + a.id + '">#' + a.id + ' — ' + esc(a.nome) + '</option>'; })
          .join('');
        const optGa = contasGa
          .map(function (a) { return '<option value="' + a.id + '">' + a.id + ' — ' + esc(a.nome) + '</option>'; })
          .join('');

        tela.innerHTML =
          '<div class="voltar"><button id="btn-voltar">← Todos os clientes</button></div>' +
          '<h2 style="font-family:var(--ui);font-size:22px;font-weight:700;margin:0 0 24px;letter-spacing:-0.02em">Adicionar cliente</h2>' +
          '<div id="form-erro"></div>' +
          '<section><h2>Identificação</h2>' +
            '<div class="campo"><label for="f-nome">Nome do cliente</label>' +
            '<input id="f-nome" placeholder="Persianas Paulista" /></div>' +
            '<div class="campo"><label for="f-slug">Endereço nas URLs</label>' +
            '<input id="f-slug" placeholder="gerado a partir do nome" />' +
            '<p class="dica">os webhooks vão apontar para /ingest/&lt;endereço&gt;/…</p></div>' +
          '</section>' +
          '<section><h2>Chatwoot</h2>' +
            '<div class="campo"><label for="f-cw">Conta</label>' +
            '<select id="f-cw"><option value="">selecione…</option>' + optCw + '</select></div>' +
            '<div class="grade">' +
              '<div class="campo"><label for="f-funil">Board do funil de Ads</label>' +
              '<select id="f-funil" disabled><option value="">escolha a conta antes</option></select>' +
              '<p class="dica">é a entrada neste board que avisa o grupo</p></div>' +
              '<div class="campo"><label for="f-organico">Board de entrada (Orgânico)</label>' +
              '<select id="f-organico" disabled><option value="">escolha a conta antes</option></select></div>' +
            '</div>' +
          '</section>' +
          '<section><h2>Google Ads e envio</h2>' +
            '<div class="grade">' +
              '<div class="campo"><label for="f-ga">Conta do Google Ads</label>' +
              '<select id="f-ga"><option value="">nenhuma</option>' + optGa + '</select></div>' +
              '<div class="campo"><label for="f-evo">Instância do WhatsApp</label>' +
              '<input id="f-evo" placeholder="nome exato no Evolution" /></div>' +
            '</div>' +
            '<div class="campo"><label for="f-pulse">codi_id do Pulseboard</label>' +
            '<input id="f-pulse" placeholder="usado para avisar o grupo do cliente" /></div>' +
          '</section>' +
          '<div class="linha-acoes"><button id="btn-salvar" class="principal">Adicionar cliente</button>' +
          '<span class="carregando" id="form-estado">começa em modo sombra: nada é enviado ao Google Ads</span></div>';

        document.getElementById('btn-voltar').addEventListener('click', verOverview);

        const nome = document.getElementById('f-nome');
        const slug = document.getElementById('f-slug');
        nome.addEventListener('input', function () {
          if (!slug.dataset.editado) slug.value = normalizarSlug(nome.value);
        });
        slug.addEventListener('input', function () { slug.dataset.editado = '1'; });

        document.getElementById('f-cw').addEventListener('change', async function (ev) {
          const acc = ev.target.value;
          const funil = document.getElementById('f-funil');
          const org = document.getElementById('f-organico');
          for (const el of [funil, org]) {
            el.disabled = true;
            el.innerHTML = '<option value="">carregando…</option>';
          }
          if (!acc) return;
          const boards = await api('/chatwoot/accounts/' + acc + '/boards');
          const opts = boards
            .map(function (b) { return '<option value="' + b.id + '">#' + b.id + ' — ' + esc(b.nome) + ' (' + b.tarefas + ' cards)</option>'; })
            .join('');
          funil.innerHTML = '<option value="">selecione…</option>' + opts;
          org.innerHTML = '<option value="">nenhum</option>' + opts;
          funil.disabled = false;
          org.disabled = false;
        });

        document.getElementById('btn-salvar').addEventListener('click', async function () {
          const alvo = document.getElementById('form-erro');
          const estado = document.getElementById('form-estado');
          alvo.innerHTML = '';
          estado.textContent = 'salvando…';
          try {
            const r = await enviar('/tenants', 'POST', {
              nome: nome.value,
              slug: slug.value,
              cw_account_id: document.getElementById('f-cw').value,
              cw_board_funil_id: document.getElementById('f-funil').value,
              cw_board_organico_id: document.getElementById('f-organico').value,
              ga_customer_id: document.getElementById('f-ga').value,
              evo_instancia: document.getElementById('f-evo').value,
              pulseboard_codi_id: document.getElementById('f-pulse').value,
            });
            verCliente(r.id);
          } catch (e) {
            alvo.innerHTML = '<div class="erro">' + esc(e.message) + '</div>';
            estado.textContent = '';
          }
        });
      }

      // ---------- etapas do funil ----------
      async function carregarFluxo(id) {
        const alvo = document.getElementById('fluxo');
        alvo.innerHTML = '<p class="carregando">carregando…</p>';
        let r;
        try {
          r = await api('/tenants/' + id + '/fluxo');
        } catch (e) {
          alvo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
          return;
        }

        const rotulo = { ok: 'ok', erro: 'erro', aguardando: 'aguarda', pendente: 'falta' };
        const marca = { ok: 'marca-ok', erro: 'marca-erro', aguardando: 'marca-na', pendente: 'marca-aviso' };

        alvo.innerHTML =
          (r.modo_sombra
            ? '<div class="aviso">Modo sombra ligado: nada é enviado de verdade ao Google Ads.</div>'
            : '') +
          r.etapas.map(function (e) {
            return '<div class="checagem">' +
              '<span class="checagem-marca ' + marca[e.estado] + '">' + rotulo[e.estado] + '</span>' +
              '<span class="checagem-titulo" style="width:260px">' + esc(e.titulo) + '</span>' +
              '<span class="checagem-detalhe">' + esc(e.detalhe) +
              '<br><span style="color:var(--ink-3)">' + esc(e.comoFunciona) + '</span></span>' +
              '</div>';
          }).join('');
      }

      async function carregarEtapas(id) {
        const alvo = document.getElementById('etapas');
        const estado = document.getElementById('etapas-estado');
        const etapas = await api('/tenants/' + id + '/stages').catch(function () { return []; });

        alvo.innerHTML = etapas.length
          ? '<table><thead><tr><th>#</th><th>Etapa</th><th>Final</th><th>Conversão</th></tr></thead><tbody>' +
            etapas.map(function (e) {
              return '<tr><td>' + e.posicao + '</td><td>' + esc(e.nome) + '</td>' +
                '<td class="motivo">' + (e.is_final ? 'sim' : '') + '</td>' +
                '<td class="' + (e.conversion_action_id ? 'st-ok' : 'st-recebido') + '">' +
                (e.conversion_action_id ? esc(e.conversion_event) + ' · ' + esc(e.conversion_action_id) : '—') +
                '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<div class="vazio"><p>Etapas ainda não sincronizadas.</p>' +
            '<p class="mono">Elas vêm do board do Chatwoot, não são digitadas aqui.</p></div>';

        estado.textContent = etapas.length ? etapas.length + ' etapas' : '';
      }

      async function sincronizarEtapas(id) {
        const estado = document.getElementById('etapas-estado');
        estado.textContent = 'lendo o board…';
        try {
          const r = await enviar('/tenants/' + id + '/stages/sync', 'POST');
          estado.textContent = r.etapas + ' etapas sincronizadas';
          await carregarEtapas(id);
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      // ---------- metas de conversão ----------
      let metasPropostas = [];

      async function preverMetas(id) {
        const alvo = document.getElementById('metas');
        const estado = document.getElementById('metas-estado');
        estado.textContent = 'consultando a conta do Google Ads…';
        alvo.innerHTML = '';
        try {
          const r = await api('/tenants/' + id + '/metas/preview');
          metasPropostas = r.metas;
          const novas = r.metas.filter(function (m) { return !m.jaExiste; }).length;
          estado.textContent = 'conta ' + r.conta + ' · ' + novas + ' a criar · ' + (r.metas.length - novas) + ' já existem';

          alvo.innerHTML =
            '<table><thead><tr><th>Criar</th><th>Nome</th><th>Etapa</th><th>Categoria</th>' +
            '<th>Valor</th><th>Contagem</th><th>Clique</th><th>Situação</th></tr></thead><tbody>' +
            r.metas.map(function (m, i) {
              return '<tr><td><input type="checkbox" data-i="' + i + '" class="m-on" ' + (m.jaExiste ? '' : 'checked') + ' /></td>' +
                '<td><input class="m-nome" data-i="' + i + '" value="' + esc(m.nome) + '" /></td>' +
                '<td class="motivo">' + esc(m.stageNome) + '</td>' +
                '<td><select class="m-cat" data-i="' + i + '">' + opcoes(['CONTACT', 'QUALIFIED_LEAD', 'PURCHASE'], m.categoria) + '</select></td>' +
                '<td><input class="m-valor" data-i="' + i + '" value="' + (m.valor === null ? '' : m.valor) + '" placeholder="real" /></td>' +
                '<td><select class="m-cont" data-i="' + i + '">' + opcoes(['ONE_PER_CLICK', 'MANY_PER_CLICK'], m.contagem) + '</select></td>' +
                '<td><input class="m-jc" data-i="' + i + '" value="' + m.janelaClique + '" style="width:52px" /></td>' +
                '<td class="' + (m.jaExiste ? 'st-ok' : 'st-recebido') + '">' + (m.jaExiste ? 'já existe' : 'nova') + '</td></tr>';
            }).join('') +
            '</tbody></table>' +
            '<p class="carregando" style="margin-top:10px">Valor vazio = a conversão carrega o valor real da negociação. ' +
            'Meta que já existe é apenas ligada à etapa, não é criada de novo.</p>' +
            '<div class="linha-acoes" style="margin-top:12px">' +
            '<button id="btn-validar">Validar no Google</button>' +
            '<button id="btn-publicar" class="principal">Publicar na conta</button></div>';

          document.getElementById('btn-validar').addEventListener('click', function () { publicarMetas(id, true); });
          document.getElementById('btn-publicar').addEventListener('click', function () { publicarMetas(id, false); });
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      function metasEditadas() {
        function ler(cls, i) { return document.querySelector('.' + cls + '[data-i="' + i + '"]'); }
        return metasPropostas
          .map(function (m, i) {
            if (!ler('m-on', i).checked) return null;
            const valor = ler('m-valor', i).value.trim();
            return Object.assign({}, m, {
              nome: ler('m-nome', i).value.trim(),
              categoria: ler('m-cat', i).value,
              valor: valor === '' ? null : Number(valor),
              contagem: ler('m-cont', i).value,
              janelaClique: Number(ler('m-jc', i).value) || 30,
            });
          })
          .filter(Boolean);
      }

      async function publicarMetas(id, validar) {
        const estado = document.getElementById('metas-estado');
        const metas = metasEditadas();
        if (!metas.length) { estado.textContent = 'nenhuma meta marcada'; return; }
        estado.textContent = validar ? 'validando no Google…' : 'publicando…';
        try {
          const r = await enviar('/tenants/' + id + '/metas', 'POST', { metas: metas, validar: validar });
          estado.textContent = validar
            ? 'validado: ' + r.seriam_criadas + ' seriam criadas, nada foi gravado'
            : r.criadas + ' criadas · ' + r.ligadas + ' ligadas a etapas';
          if (!validar) { await preverMetas(id); await carregarEtapas(id); }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      document.getElementById('btn-novo').addEventListener('click', verFormulario);
      document.getElementById('btn-atualizar').addEventListener('click', verOverview);

      verOverview().catch((e) => {
        tela.innerHTML =
          e.message === 'sem-acesso'
            ? `<div class="vazio">
                 <p>Este painel exige login pelo Cloudflare Access.</p>
                 <p class="mono">Crie uma aplicação do Access para este domínio e cadastre o <code>aud</code> dela em CF_ACCESS_AUD.</p>
               </div>`
            : `<div class="vazio"><p>Não foi possível carregar.</p><p class="mono">${esc(e.message)}</p></div>`;
      });
    </script>
  </body>
</html>
