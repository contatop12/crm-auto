<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P12 CRM Auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f2f4f6;
        --panel: #ffffff;
        --ink: #14181d;
        --ink-2: #5a646e;
        --ink-3: #98a2ac;
        --rule: #dde3e8;

        --pass: #1f7a5c;
        --halt: #b23a2e;
        --hold: #a9761b;
        --idle: #c3cad1;

        --ui: 'Archivo', ui-sans-serif, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--ui);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- estrutura ---------- */
      .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        padding: 28px 0 20px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 28px;
        flex-wrap: wrap;
      }
      header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      header .meta { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-left: auto; }

      button {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-2);
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover { color: var(--ink); border-color: var(--ink-3); }
      button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      /* ---------- trilha: a marca da tela ---------- */
      .cliente {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 4px;
        padding: 18px 20px 16px;
        margin-bottom: 10px;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }
      .cliente:hover { border-color: var(--ink-3); }
      .cliente:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .cliente-topo { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
      .cliente-nome { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
      .cliente-slug { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
      .cliente-sinal { margin-left: auto; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .sinal-ok { color: var(--pass); }
      .sinal-erro { color: var(--halt); }
      .sinal-silencio { color: var(--ink-3); }

      /* cada traço é um evento; mais recente à direita */
      .trilha { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-bottom: 12px; }
      .tick { width: 5px; border-radius: 1px; background: var(--idle); }
      .tick-ok { background: var(--pass); height: 16px; }
      .tick-ignorado { background: var(--hold); height: 11px; }
      .tick-erro { background: var(--halt); height: 26px; }
      .tick-recebido { background: var(--idle); height: 8px; }
      .trilha-vazia { font-family: var(--mono); font-size: 12px; color: var(--ink-3); align-self: center; }

      @media (prefers-reduced-motion: no-preference) {
        .tick { animation: surgir .18s ease-out backwards; }
        @keyframes surgir { from { transform: scaleY(.2); opacity: 0; } }
      }

      .cliente-stats { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
      .cliente-stats b { font-weight: 500; color: var(--ink); }
      .cliente-erro { color: var(--halt); }

      /* ---------- detalhe ---------- */
      .voltar { margin-bottom: 20px; }

      section { margin-bottom: 32px; }
      section > h2 {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: var(--ink-3);
        margin: 0 0 12px;
      }

      .checagem {
        display: flex;
        gap: 12px;
        padding: 9px 14px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-top: none;
        font-size: 14px;
      }
      .checagem:first-of-type { border-top: 1px solid var(--rule); border-radius: 4px 4px 0 0; }
      .checagem:last-of-type { border-radius: 0 0 4px 4px; }
      .checagem-marca { font-family: var(--mono); font-size: 11px; width: 52px; flex: none; padding-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
      .marca-ok { color: var(--pass); }
      .marca-erro { color: var(--halt); }
      .marca-aviso { color: var(--hold); }
      .marca-na { color: var(--ink-3); }
      .checagem-titulo { font-weight: 500; flex: none; width: 200px; }
      .checagem-detalhe { font-family: var(--mono); font-size: 12px; color: var(--ink-2); word-break: break-word; }

      table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; }
      th {
        font-family: var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .08em; color: var(--ink-3); text-align: left;
        padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap;
      }
      td { padding: 9px 12px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      tr.clicavel { cursor: pointer; }
      tr.clicavel:hover td { background: var(--paper); }
      .st-ok { color: var(--pass); }
      .st-erro { color: var(--halt); }
      .st-ignorado { color: var(--hold); }
      .st-recebido { color: var(--ink-3); }
      .motivo { color: var(--ink-2); }

      /* segunda linha da célula: o dado técnico embaixo do dado legível */
      .sub {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        font-family: var(--mono);
        margin-top: 2px;
      }
      .tag {
        display: inline-block;
        padding: 0 5px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        font-size: 11px;
        line-height: 16px;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .tag-novo { border-color: var(--pass); color: var(--pass); }
      .tag-anuncio { border-color: var(--hold); color: var(--hold); }
      .nada { color: var(--ink-3); }

      .paginacao {
        display: flex; align-items: center; gap: 12px;
        margin-top: 12px; flex-wrap: wrap;
      }
      .paginacao button[disabled] { opacity: .4; cursor: default; }

      /* Gira enquanto a fila trabalha. O reprocessamento e' assincrono: sem
         sinal de atividade a tela parece travada. */
      .girando {
        display: inline-block; width: 12px; height: 12px;
        border: 2px solid var(--rule); border-top-color: var(--ink-2);
        border-radius: 50%; vertical-align: -2px; margin-right: 6px;
        animation: gira .7s linear infinite;
      }
      @keyframes gira { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .girando { animation-duration: 2.5s; } }

      /* Switch de envio ao Google. Estado ligado = conversao vai de verdade,
         entao ele e' vermelho quando armado, nao verde. */
      .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch .trilho {
        width: 40px; height: 22px; border-radius: 11px;
        background: var(--idle); border: 1px solid var(--rule);
        position: relative; transition: background .15s;
      }
      .switch .trilho::after {
        content: ''; position: absolute; top: 2px; left: 2px;
        width: 16px; height: 16px; border-radius: 50%;
        background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
      }
      .switch input:checked + .trilho { background: var(--halt); border-color: var(--halt); }
      .switch input:checked + .trilho::after { transform: translateX(18px); }
      .switch input:focus-visible + .trilho { outline: 2px solid var(--ink); outline-offset: 2px; }
      .switch .rotulo { font-size: 13px; }

      dl.resumo {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 14px;
        margin: 0 0 12px;
        font-size: 12px;
      }
      dl.resumo dt { color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
      dl.resumo dd { margin: 0; font-family: var(--mono); }

      pre {
        font-family: var(--mono); font-size: 12px; line-height: 1.55;
        background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
        padding: 14px; overflow-x: auto; margin: 0; max-height: 460px;
      }

      .aviso {
        font-family: var(--mono); font-size: 12px; color: var(--ink-2);
        background: var(--panel); border: 1px solid var(--rule); border-left: 2px solid var(--hold);
        border-radius: 3px; padding: 10px 14px; margin-bottom: 16px;
      }

      .vazio {
        background: var(--panel); border: 1px dashed var(--rule); border-radius: 4px;
        padding: 40px 24px; text-align: center; color: var(--ink-2);
      }
      .vazio p { margin: 0 0 6px; }
      .vazio .mono { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

      .linha-acoes { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
      .carregando { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

      /* ---------- abas ---------- */
      .abas {
        display: flex; gap: 2px; border-bottom: 1px solid var(--rule);
        margin: 0 0 28px; overflow-x: auto;
      }
      .aba {
        font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
        color: var(--ink-3); background: none; border: none; border-radius: 0;
        padding: 9px 14px; margin-bottom: -1px;
        border-bottom: 2px solid transparent; white-space: nowrap;
      }
      .aba:hover { color: var(--ink-2); border-color: var(--rule); background: none; }
      .aba[aria-selected="true"] {
        color: var(--ink); border-bottom-color: var(--ink); font-weight: 700;
      }
      /* a contagem de pendências fica ao lado do nome, não numa cor de alerta */
      .aba .conta { color: var(--halt); margin-left: 6px; }
      .painel[hidden] { display: none; }
      .painel > section:first-child { margin-top: 0; }

      /* ---------- formulario ---------- */
      .campo { margin-bottom: 14px; }
      .campo label {
        display: block; font-family: var(--mono); font-size: 11px;
        text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 5px;
      }
      .campo .dica { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-top: 4px; }
      input, select {
        width: 100%; font-family: var(--mono); font-size: 13px; color: var(--ink);
        background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; padding: 7px 9px;
      }
      input:focus, select:focus { outline: 2px solid var(--ink); outline-offset: -1px; border-color: var(--ink); }
      input[type=checkbox] { width: auto; }
      .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      .erro {
        font-family: var(--mono); font-size: 12px; color: var(--halt);
        background: var(--panel); border: 1px solid var(--rule); border-left: 2px solid var(--halt);
        border-radius: 3px; padding: 10px 14px; margin-bottom: 14px;
      }
      .principal { color: var(--panel); background: var(--ink); border-color: var(--ink); }
      .principal:hover { color: var(--panel); background: #000; }
      td input, td select { padding: 4px 6px; font-size: 12px; }

      @media (max-width: 700px) {
        .grade { grid-template-columns: 1fr; }
        .checagem { flex-wrap: wrap; }
        .checagem-titulo { width: auto; }
        .esconder-mobile { display: none; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header>
        <h1>P12 CRM Auto</h1>
        <button id="btn-atualizar">Atualizar</button>
        <button id="btn-novo">Adicionar cliente</button>
        <button id="btn-padroes">Padronizações</button>
        <span class="meta" id="rodape"></span>
      </header>
      <main id="tela"><p class="carregando">Carregando…</p></main>
    </div>

    <script>
      const tela = document.getElementById('tela');
      const rodape = document.getElementById('rodape');

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      async function api(caminho) {
        const r = await fetch('/api' + caminho);
        if (r.status === 401) throw new Error('sem-acesso');
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
        return r.json();
      }

      function haQuanto(iso) {
        if (!iso) return 'nunca';
        const seg = (Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime()) / 1000;
        if (seg < 90) return 'há instantes';
        if (seg < 5400) return 'há ' + Math.round(seg / 60) + ' min';
        if (seg < 172800) return 'há ' + Math.round(seg / 3600) + ' h';
        return 'há ' + Math.round(seg / 86400) + ' dias';
      }

      const hora = (iso) =>
        !iso ? '' : new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });

      // ---------- lista de clientes ----------
      async function verOverview() {
        tela.innerHTML = '<p class="carregando">Carregando clientes…</p>';
        const clientes = await api('/overview');

        if (!clientes.length) {
          tela.innerHTML = `
            <div class="vazio">
              <p>Nenhum cliente cadastrado ainda.</p>
              <p class="mono">Cadastre o primeiro para começar a receber webhooks.</p>
            </div>`;
          rodape.textContent = 'nenhum cliente';
          return;
        }

        // busca a trilha de cada cliente em paralelo. A rota devolve uma pagina
        // ({ linhas, total }), nao um array — o `?? []` cobre tanto a falha
        // quanto uma resposta em formato inesperado.
        const trilhas = await Promise.all(
          clientes.map((c) =>
            api('/tenants/' + c.tenant_id + '/events?limit=40')
              .then((r) => r.linhas ?? [])
              .catch(() => []),
          ),
        );

        tela.innerHTML = clientes
          .map((c, i) => {
            // eventos vêm do mais novo para o mais velho; a trilha lê ao contrário
            const ticks = trilhas[i]
              .slice()
              .reverse()
              .map(
                (e, j) =>
                  `<span class="tick tick-${esc(e.status)}" style="animation-delay:${j * 8}ms" title="${esc(
                    e.event_type,
                  )} · ${esc(e.status)}${e.motivo ? ' · ' + esc(e.motivo) : ''}"></span>`,
              )
              .join('');

            const rotulo = { ok: 'operando', erro: 'com erro', silencio: 'sem eventos' }[c.sinal];

            return `
            <button class="cliente" data-id="${c.tenant_id}">
              <div class="cliente-topo">
                <span class="cliente-nome">${esc(c.nome)}</span>
                <span class="cliente-slug">${esc(c.slug)}</span>
                <span class="cliente-sinal sinal-${c.sinal}">${rotulo}</span>
              </div>
              <div class="trilha">${ticks || '<span class="trilha-vazia">sem eventos registrados</span>'}</div>
              <div class="cliente-stats">
                <b>${c.recebidos_24h}</b> em 24h · <b>${c.erros_24h}</b> ${
                  c.erros_24h === 1 ? 'erro' : 'erros'
                } · <b>${c.leads}</b> leads · <b>${c.conversoes_enviadas}</b> conversões
                · último evento ${haQuanto(c.ultimo_evento_em)}
                ${c.ultimo_erro_motivo ? `<br><span class="cliente-erro">último erro: ${esc(c.ultimo_erro_motivo)}</span>` : ''}
              </div>
            </button>`;
          })
          .join('');

        tela.querySelectorAll('.cliente').forEach((el) =>
          el.addEventListener('click', () => verCliente(el.dataset.id)),
        );
        rodape.textContent = clientes.length + ' clientes · ' + new Date().toLocaleTimeString('pt-BR');
      }

      // ---------- detalhe de um cliente ----------
      /**
       * Detalhe do cliente, em abas.
       *
       * Cada aba carrega os dados na PRIMEIRA vez que e' aberta. Carregar tudo
       * de uma vez dispararia sete chamadas — varias batendo em Chatwoot,
       * Google Ads e Evolution — so para mostrar a primeira.
       */
      async function verCliente(id) {
        tela.innerHTML = '<p class="carregando">Carregando…</p>';
        const [cliente] = (await api('/overview')).filter((c) => String(c.tenant_id) === String(id));

        tela.innerHTML = `
          <div class="voltar"><button id="btn-voltar">← Todos os clientes</button></div>
          <h2 style="font-family:var(--ui);font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em">
            ${esc(cliente ? cliente.nome : 'Cliente ' + id)}
          </h2>
          <p class="cliente-slug" style="margin:0 0 12px">${esc(cliente ? cliente.slug : '')}</p>
          <div class="linha-acoes" style="margin:0 0 20px">
            <button id="btn-editar">Editar cliente</button>
            <label class="switch" title="Ligado, a conversão é gravada no Google Ads">
              <input type="checkbox" id="sw-envio" />
              <span class="trilho"></span>
              <span class="rotulo" id="sw-rotulo">…</span>
            </label>
          </div>

          <div class="abas" role="tablist">
            <button class="aba" role="tab" data-aba="fluxo" aria-selected="true">Fluxo</button>
            <button class="aba" role="tab" data-aba="config" aria-selected="false">Configuração</button>
            <button class="aba" role="tab" data-aba="integracoes" aria-selected="false">Integrações</button>
            <button class="aba" role="tab" data-aba="atividade" aria-selected="false">Atividade</button>
          </div>

          <div class="painel" data-painel="fluxo">
          <section>
            <h2>Fluxo do lead</h2>
            <div id="fluxo"></div>
          </section>
          </div>

          <div class="painel" data-painel="config" hidden>
          <section>
            <h2>Etapas do funil</h2>
            <div class="linha-acoes">
              <button id="btn-sync">Sincronizar do board</button>
              <span class="carregando" id="etapas-estado"></span>
            </div>
            <div id="etapas"></div>
          </section>

          <section>
            <h2>Frases que movem os cards</h2>
            <div class="linha-acoes">
              <input id="g-frase" placeholder="segue a proposta" style="max-width:280px" />
              <select id="g-etapa" style="max-width:220px"></select>
              <input id="g-emoji" placeholder="emoji (opcional)" style="max-width:150px" />
              <button id="btn-gatilho" class="principal">Adicionar</button>
              <span class="carregando" id="gatilho-estado"></span>
            </div>
            <div id="gatilhos"></div>
          </section>

          <section>
            <h2>Etiquetas deste cliente</h2>
            <div class="linha-acoes">
              <input id="l-slug" placeholder="nome da etiqueta (ex: reagendar)" />
              <input id="l-cor" type="color" value="#999999" style="width:52px;padding:2px" />
              <input id="l-desc" placeholder="descrição" />
              <button id="btn-l-add">Criar no Chatwoot</button>
              <span class="carregando" id="etiquetas-estado"></span>
            </div>
            <div id="etiquetas"></div>
          </section>

          <section>
            <h2>Metas de conversão no Google Ads</h2>
            <div class="linha-acoes">
              <button id="btn-metas">Gerar metas</button>
              <button id="btn-meta-nova">Adicionar meta</button>
              <span class="carregando" id="metas-estado">propõe a partir das etapas e mostra antes de publicar</span>
            </div>
            <div id="metas"></div>
          </section>

          <section>
            <h2>Números de WhatsApp</h2>
            <div id="instancias"></div>
          </section>
          </div>

          <div class="painel" data-painel="integracoes" hidden>
          <section>
            <h2>Integrações</h2>
            <div class="linha-acoes">
              <button id="btn-checar">Checar agora</button>
              <span class="carregando" id="checagem-estado">consulta Chatwoot, Google Ads, etiquetas e WhatsApp ao vivo</span>
            </div>
            <div id="checagens"></div>
          </section>

          <section>
            <h2>Etiquetas e atributos</h2>
            <div class="linha-acoes">
              <button id="btn-prov">Conferir</button>
              <button id="btn-prov-criar" class="principal">Gerar no Chatwoot</button>
              <span class="carregando" id="prov-estado">cria o que falta, conforme as Padronizacoes</span>
            </div>
            <div id="prov"></div>
          </section>

          <section>
            <h2>Webhooks no Chatwoot</h2>
            <div class="linha-acoes">
              <button id="btn-webhook">Registrar webhook do painel</button>
              <span class="carregando" id="webhook-estado"></span>
            </div>
            <div id="webhooks"></div>
          </section>
          </div>

          <div class="painel" data-painel="atividade" hidden>
          <section>
            <h2>Avisos de lead novo no grupo</h2>
            <div id="avisos"></div>
          </section>

          <section>
            <h2>Reprocessar o que ficou para trás</h2>
            <div class="linha-acoes">
              <button id="btn-reproc">Conferir</button>
              <button id="btn-reproc-aplicar" class="principal">Reprocessar</button>
              <span class="carregando" id="reproc-estado">roda o pipeline atual sobre os webhooks já recebidos</span>
            </div>
          </section>

          <section>
            <h2>Últimos webhooks recebidos</h2>

      // O Chatwoot posta sem seguir redirect. Se o Access ainda cobre /ingest,
      // registrar o webhook só faria ele bater numa página de login e perder o
      // evento — por isso a sondagem antes.
      //
      // Usa /ping, que não grava evento. A sondagem antiga era um POST vazio na
      // rota real: dava 401 por falta de assinatura e gravava um erro, que
      // aparecia no painel como se o cliente estivesse quebrado.
      async function ingestAlcancavel(slug) {
        try {
          const r = await fetch('/ingest/' + slug + '/ping', { method: 'GET' });
          if (r.redirected || /cloudflareaccess\.com/.test(r.url)) return false;
          return r.status === 204;
        } catch {
          return false;
        }
      }

      async function mudarWebhook(id, slug, metodo) {
        const estado = document.getElementById('webhook-estado');
        const botao = document.getElementById('btn-webhook');
        botao.disabled = true;

        if (metodo === 'POST') {
          estado.textContent = 'conferindo se a rota de ingestão está pública…';
          if (!(await ingestAlcancavel(slug))) {
            estado.textContent =
              'a rota /ingest está atrás do Access — o Chatwoot receberia a tela de login. Crie um app do Access com política Bypass para o path ingest.';
            botao.disabled = false;
            return;
          }
        }

        estado.textContent = metodo === 'POST' ? 'registrando…' : 'removendo…';
        try {
          const r = await fetch('/api/tenants/' + id + '/webhook', { method: metodo });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
          await carregarWebhooks(id, slug);
          if (metodo === 'POST') {
            document.getElementById('webhook-estado').textContent =
              (j.adotado ? 'adotado o que já existia' : 'registrado') +
              ' · assinatura ' + j.assinatura +
              (j.aviso ? ' · ' + j.aviso : '');
          }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        } finally {
          botao.disabled = false;
        }
      }

              </div>`,
            )
            .join('');

      /**
       * Uma linha de evento que diz de quem é.
       *
       * "message_incoming / ignorado" é verdade e não serve: não dá para saber
       * se é lead novo ou conversa velha, de que board veio, nem se aquele lead
       * já foi tratado. Tudo isso já vinha no payload — faltava mostrar.
       */
      function linhaEvento(e) {
        const r = e.resumo || {};
        const nada = '<span class="nada">—</span>';

        const lead = r.quem
          ? esc(r.quem) + (r.telefone ? '<span class="sub">' + esc(r.telefone) + '</span>' : '')
          : (r.telefone ? '<span class="mono">' + esc(r.telefone) + '</span>' : nada);

        const tags = [];
        if (r.momento === 'lead novo') tags.push('<span class="tag tag-novo">lead novo</span>');
        else if (r.momento) tags.push('<span class="tag">em andamento</span>');
        if (r.origem === 'anuncio') tags.push('<span class="tag tag-anuncio">anúncio</span>');
        else if (r.origem === 'organico') tags.push('<span class="tag">orgânico</span>');

        const detalhe = [];
        if (r.conversaId) detalhe.push('conversa ' + r.conversaId);
        if (r.idadeConversa !== null && r.idadeConversa !== undefined) detalhe.push('aberta há ' + duracao(r.idadeConversa));
        if (r.conversaEnviada) detalhe.push('conversão já enviada');

        const conversa = (tags.join(' ') || nada) +
          (detalhe.length ? '<span class="sub">' + esc(detalhe.join(' · ')) + '</span>' : '');

        const card = r.board
          ? esc(r.board) + (r.etapa ? '<span class="sub">' + esc(r.etapa) + '</span>' : '')
          : nada;

        return `
          <tr class="clicavel" data-ev="${e.id}">
            <td title="${esc(hora(e.received_at))}">${haQuanto(e.received_at)}</td>
            <td>${esc(e.pipeline || e.event_type)}<span class="sub">${esc(e.source)} · ${esc(e.event_type)}${r.autor ? ' · ' + esc(r.autor) : ''}</span></td>
            <td>${lead}</td>
            <td>${conversa}</td>
            <td class="esconder-mobile">${card}</td>
            <td class="st-${esc(e.status)}">${esc(e.status)}</td>
            <td class="motivo esconder-mobile">${esc(e.motivo || '')}</td>
            <td>${e.signature_ok === null ? '—' : e.signature_ok ? 'ok' : 'falhou'}</td>
          </tr>`;
      }

      /** De quem e' este webhook, acima do json — para nao ter que garimpar. */
      function cabecalhoResumo(r) {
        if (!r) return '';
        const campos = [
          ['Lead', r.quem],
          ['Telefone', r.telefone],
          ['Conversa', r.conversaId],
          ['Inbox', r.inbox],
          ['Card', r.board && r.etapa ? r.board + ' › ' + r.etapa : r.board],
          ['Protocolo', r.protocolo],
          ['Origem', r.origem],
          ['Momento', r.momento],
          ['Aberta há', r.idadeConversa === null || r.idadeConversa === undefined ? null : duracao(r.idadeConversa)],
          ['Etiquetas', (r.etiquetas || []).join(', ')],
        ].filter(function (c) { return c[1] !== null && c[1] !== undefined && c[1] !== ''; });

        if (!campos.length) return '';
        return '<dl class="resumo">' + campos
          .map(function (c) { return '<dt>' + esc(c[0]) + '</dt><dd>' + esc(String(c[1])) + '</dd>'; })
          .join('') + '</dl>';
      }

      function duracao(seg) {
        if (seg < 60) return seg + 's';
        if (seg < 3600) return Math.round(seg / 60) + ' min';
        if (seg < 86400) return Math.round(seg / 3600) + ' h';
        return Math.round(seg / 86400) + ' d';
      }

      async function verPayload(tenantId, eventId, revelar) {
        const secao = document.getElementById('secao-payload');
        const pre = document.getElementById('payload');
        const aviso = document.getElementById('payload-aviso');
        const botao = document.getElementById('btn-revelar');

        secao.hidden = false;
        // o corpo do webhook fica na aba Atividade; se o clique veio de outra,
        // mostrar o painel sem trocar de aba deixaria a tela em branco
        const painel = secao.closest('.painel');
        if (painel && painel.hidden) {
          const b = document.querySelector('.aba[data-aba="' + painel.dataset.painel + '"]');
          if (b) b.click();
        }
        pre.textContent = 'carregando…';
        secao.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const r = await api(
          '/tenants/' + tenantId + '/events/' + eventId + '/payload' + (revelar ? '?revelar=1' : ''),
        );

        pre.textContent = r.payload || '(vazio)';
        document.getElementById('payload-quem').innerHTML = cabecalhoResumo(r.resumo);
        if (r.expirado) {
          aviso.textContent = r.motivo;
          botao.hidden = true;
        } else {
          aviso.textContent = r.mascarado
            ? 'Telefone, e-mail e texto das mensagens estão mascarados.'
            : 'Mostrando os dados originais do lead.';
          botao.hidden = false;
          botao.textContent = r.mascarado ? 'Revelar dados originais' : 'Voltar a mascarar';
          botao.onclick = () => verPayload(tenantId, eventId, !!r.mascarado);
        }
      }

      async function enviar(caminho, metodo, corpo) {
        const r = await fetch('/api' + caminho, {
          method: metodo,
          headers: { 'content-type': 'application/json' },
          body: corpo === undefined ? undefined : JSON.stringify(corpo),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
        return j;
      }

      function normalizarSlug(v) {
        return String(v || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function opcoes(lista, valorAtual) {
        return lista
          .map(function (o) { return '<option ' + (o === valorAtual ? 'selected' : '') + '>' + o + '</option>'; })
          .join('');
      }

            cw_board_funil_id: document.getElementById('f-funil').value,
            cw_board_organico_id: document.getElementById('f-organico').value,
            ga_customer_id: document.getElementById('f-ga').value,
            evo_instancia: document.getElementById('f-evo').value,
            pulseboard_codi_id: document.getElementById('f-pulse').value,
          };
          try {
            if (atual) {
              campos.validate_only = document.getElementById('f-sombra').checked ? 1 : 0;
              await enviar('/tenants/' + id, 'PATCH', campos);
              verCliente(id);
            } else {
              campos.slug = slug.value;
              const r = await enviar('/tenants', 'POST', campos);
              verCliente(r.id);
            }
          } catch (e) {
            alvo.innerHTML = '<div class="erro">' + esc(e.message) + '</div>';
            estado.textContent = '';
          }
        });
      }

      // ---------- etapas do funil ----------
      async function carregarFluxo(id) {
        const alvo = document.getElementById('fluxo');
        alvo.innerHTML = '<p class="carregando">carregando…</p>';
        let r;
        try {
          r = await api('/tenants/' + id + '/fluxo');
        } catch (e) {
          alvo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
          return;
        }

        const rotulo = { ok: 'ok', erro: 'erro', aguardando: 'aguarda', pendente: 'falta' };
        const marca = { ok: 'marca-ok', erro: 'marca-erro', aguardando: 'marca-na', pendente: 'marca-aviso' };

        alvo.innerHTML =
          (r.modo_sombra
            ? '<div class="aviso">Modo sombra ligado: nada é enviado de verdade ao Google Ads.</div>'
            : '') +
          r.etapas.map(function (e) {
            return '<div class="checagem">' +
              '<span class="checagem-marca ' + marca[e.estado] + '">' + rotulo[e.estado] + '</span>' +
              '<span class="checagem-titulo" style="width:260px">' + esc(e.titulo) + '</span>' +
              '<span class="checagem-detalhe">' + esc(e.detalhe) +
              '<br><span style="color:var(--ink-3)">' + esc(e.comoFunciona) + '</span></span>' +
              '</div>';
          }).join('');
      }

      async function carregarInstancias(id) {
        const alvo = document.getElementById('instancias');
        let linhas;
        try {
          linhas = await api('/tenants/' + id + '/instancias');
        } catch (e) {
          alvo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
          return;
        }
        alvo.innerHTML = linhas.length
          ? '<table><thead><tr><th>Inbox</th><th>Nome no Chatwoot</th><th>Instância no Evolution</th></tr></thead><tbody>' +
            linhas.map(function (l) {
              return '<tr><td>' + l.cw_inbox_id + '</td><td class="motivo">' + esc(l.cw_inbox_nome || '') + '</td>' +
                '<td>' + esc(l.evo_instancia) + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<div class="vazio"><p>Nenhum número mapeado.</p>' +
            '<p class="mono">Sem isso as etiquetas não são aplicadas no WhatsApp.</p></div>';
      }

      // Os gatilhos sao a parte que mais muda: a equipe troca o texto do
      // atendimento e o funil para de andar sem ninguem perceber.
      async function carregarGatilhos(id) {
        const alvo = document.getElementById('gatilhos');
        const sel = document.getElementById('g-etapa');

        const [gatilhos, etapas] = await Promise.all([
          api('/tenants/' + id + '/gatilhos').catch(function () { return []; }),
          api('/tenants/' + id + '/stages').catch(function () { return []; }),
        ]);

        sel.innerHTML = etapas.length
          ? etapas.map(function (e) {
              return '<option value="' + e.id + '">' + esc(e.nome) + '</option>';
            }).join('')
          : '<option value="">sincronize as etapas antes</option>';

        alvo.innerHTML = gatilhos.length
          ? '<table><thead><tr><th>Frase</th><th>Emoji</th><th>Move para</th><th></th></tr></thead><tbody>' +
            gatilhos.map(function (g) {
              return '<tr><td>' + esc(g.frase) + '</td>' +
                '<td>' + esc(g.emoji_obrigatorio || '') + '</td>' +
                '<td class="motivo">' + esc(g.stage_nome) + '</td>' +
                '<td><button class="g-del" data-g="' + g.id + '">remover</button></td></tr>';
            }).join('') + '</tbody></table>'
          : '<div class="vazio"><p>Nenhuma frase cadastrada.</p>' +
            '<p class="mono">Sem frase, o card só avança pela resposta automática.</p></div>';

        alvo.querySelectorAll('.g-del').forEach(function (b) {
          b.addEventListener('click', async function () {
            try {
              await enviar('/tenants/' + id + '/gatilhos/' + b.dataset.g, 'DELETE');
              await carregarGatilhos(id);
            } catch (e) {
              document.getElementById('gatilho-estado').textContent = 'falhou: ' + e.message;
            }
          });
        });

        document.getElementById('gatilho-estado').textContent =
          gatilhos.length ? gatilhos.length + ' frases' : '';
      }

      async function adicionarGatilho(id) {
        const frase = document.getElementById('g-frase');
        const etapa = document.getElementById('g-etapa');
        const emoji = document.getElementById('g-emoji');
        const estado = document.getElementById('gatilho-estado');
        try {
          await enviar('/tenants/' + id + '/gatilhos', 'POST', {
            frase: frase.value,
            stage_id: Number(etapa.value),
            emoji: emoji.value,
          });
          frase.value = '';
          emoji.value = '';
          await carregarGatilhos(id);
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      async function carregarEtapas(id) {
        const alvo = document.getElementById('etapas');
        const estado = document.getElementById('etapas-estado');
        // as frases entram na coluna "como o card chega", entao vem junto: buscar
        // em paralelo e renderizar depois evita a tabela desenhar sem elas
        const [etapas, gatilhos] = await Promise.all([
          api('/tenants/' + id + '/stages').catch(function () { return []; }),
          api('/tenants/' + id + '/gatilhos').catch(function () { return []; }),
        ]);
        frasesPorEtapa = {};
        gatilhos.forEach(function (g) {
          frasesPorEtapa[g.stage_id] = (frasesPorEtapa[g.stage_id] || 0) + 1;
        });

        alvo.innerHTML = etapas.length
          ? '<table><thead><tr><th>#</th><th>Etapa</th><th>Como o card chega</th><th>Final</th><th>Conversão</th></tr></thead><tbody>' +
            etapas.map(function (e, i) {
              return '<tr><td>' + e.posicao + '</td><td>' + esc(e.nome) + '</td>' +
                '<td class="motivo">' + comoChega(e, i) + '</td>' +
                '<td class="motivo">' + (e.is_final ? 'sim' : '') + '</td>' +
                '<td class="' + (e.conversion_action_id ? 'st-ok' : 'st-recebido') + '">' +
                (e.conversion_action_id
                  ? esc(e.conversion_event) + ' · ' + esc(e.conversion_action_id) +
                    '<span class="sub">' + (e.conversion_value === null ? 'valor real da venda' : 'R$ ' + e.conversion_value) + '</span>'
                  : '—') +
                '</td></tr>';
            }).join('') + '</tbody></table>'
            + '<p class="carregando" style="margin-top:10px">As etapas vêm do board do Chatwoot. ' +
              'Automático = o card anda sozinho; as demais dependem de uma frase abaixo, ou da mão do vendedor.</p>'
          : '<div class="vazio"><p>Etapas ainda não sincronizadas.</p>' +
            '<p class="mono">Elas vêm do board do Chatwoot, não são digitadas aqui.</p></div>';

        estado.textContent = etapas.length ? etapas.length + ' etapas' : '';
      }

      /**
       * O que faz o card chegar nesta etapa — a coluna que a planilha de etapas
       * do cliente chama de "Como o lead chega nesta etapa".
       *
       * Sem ela a tabela nao distingue etapa que anda sozinha de etapa que
       * espera uma frase, e as duas regras "Automático" da planilha ficavam
       * invisíveis no painel.
       */
      function comoChega(e, i) {
        if (i === 0) return 'automático · primeira mensagem do lead';
        if (e.auto_on_reply) return 'automático · primeira resposta do comercial';
        if (e.is_final) return 'manual · o vendedor informa o valor antes';
        const n = (frasesPorEtapa[e.id] || 0);
        return n ? n + (n === 1 ? ' frase' : ' frases') : '<span class="nada">sem frase</span>';
      }

      /** Quantas frases movem para cada etapa, para a coluna acima. */
      let frasesPorEtapa = {};

      async function sincronizarEtapas(id) {
        const estado = document.getElementById('etapas-estado');
        estado.textContent = 'lendo o board…';
        try {
          const r = await enviar('/tenants/' + id + '/stages/sync', 'POST');
          estado.textContent = r.etapas + ' etapas sincronizadas';
          await carregarEtapas(id);
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      // ---------- metas de conversão ----------
      let metasPropostas = [];
      let contaMetas = null;

      async function preverMetas(id) {
        const estado = document.getElementById('metas-estado');
        estado.textContent = 'consultando a conta do Google Ads…';
        document.getElementById('metas').innerHTML = '';
        try {
          const r = await api('/tenants/' + id + '/metas/preview');
          metasPropostas = r.metas;
          contaMetas = r.conta;
          renderMetas(id);
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      function renderMetas(id) {
        const estado = document.getElementById('metas-estado');
        const novas = metasPropostas.filter(function (m) { return !m.jaExiste; }).length;
        estado.textContent =
          (contaMetas ? 'conta ' + contaMetas + ' · ' : '') +
          novas + ' a criar · ' + (metasPropostas.length - novas) + ' já existem';

        document.getElementById('metas').innerHTML =
          '<table><thead><tr><th>Criar</th><th>Nome</th><th>Etapa</th><th>Categoria</th>' +
          '<th>Valor</th><th>Contagem</th><th>Clique</th><th>Situação</th></tr></thead><tbody>' +
          metasPropostas.map(function (m, i) {
            return '<tr><td><input type="checkbox" data-i="' + i + '" class="m-on" ' + (m.marcada ? 'checked' : '') + ' /></td>' +
              '<td><input class="m-nome" data-i="' + i + '" value="' + esc(m.nome) + '" /></td>' +
              '<td>' + seletorEtapa(m, i) + '</td>' +
              '<td><select class="m-cat" data-i="' + i + '">' + opcoes(['CONTACT', 'QUALIFIED_LEAD', 'PURCHASE'], m.categoria) + '</select></td>' +
              '<td><input class="m-valor" data-i="' + i + '" value="' + (m.valor === null ? '' : m.valor) + '" placeholder="real" /></td>' +
              '<td><select class="m-cont" data-i="' + i + '">' + opcoes(['ONE_PER_CLICK', 'MANY_PER_CLICK'], m.contagem) + '</select></td>' +
              '<td><input class="m-jc" data-i="' + i + '" value="' + m.janelaClique + '" style="width:52px" /></td>' +
              (m.fora
                ? '<td><button class="m-fora" data-i="' + i + '">remover</button></td>'
                : '<td class="' + (m.jaExiste ? 'st-ok' : 'st-recebido') + '">' + (m.jaExiste ? 'já existe' : 'nova') + '</td>') +
              '</tr>';
          }).join('') +
          '</tbody></table>' +
          '<p class="carregando" style="margin-top:10px">As metas do catálogo têm o mesmo nome em todos os clientes; o que muda é a etapa que dispara cada uma. ' +
          'Valor vazio = a conversão carrega o valor real da negociação. ' +
          'Meta que já existe é apenas ligada à etapa, não é criada de novo. ' +
          'Meta adicionada à mão vale só para este cliente.</p>' +
          '<div class="linha-acoes" style="margin-top:12px">' +
          '<button id="btn-validar">Validar no Google</button>' +
          '<button id="btn-publicar" class="principal">Publicar na conta</button></div>';

        document.getElementById('btn-validar').addEventListener('click', function () { publicarMetas(id, true); });
        document.getElementById('btn-publicar').addEventListener('click', function () { publicarMetas(id, false); });
        document.querySelectorAll('.m-fora').forEach(function (b) {
          b.addEventListener('click', function () { removerMeta(id, Number(b.dataset.i)); });
        });
      }

      // Uma meta fora do catálogo: o cliente que precisa de uma conversão que os
      // outros não têm. Mesmo caminho de publicação das demais — o que muda é que
      // o evento vem do nome, já que não há entrada no catálogo para consultar.
      function adicionarMeta(id) {
        if (!metasPropostas.length) {
          document.getElementById('metas-estado').textContent = 'gere as metas antes de adicionar uma';
          return;
        }
        guardarEdicoes();
        metasPropostas = metasPropostas.concat([{
          evento: '',
          nome: 'CRM - ',
          categoria: 'QUALIFIED_LEAD',
          valor: null,
          primary: false,
          contagem: 'ONE_PER_CLICK',
          janelaClique: 30,
          janelaView: 1,
          stageId: null,
          stageNome: '',
          etapasPossiveis: metasPropostas[0].etapasPossiveis || [],
          jaExiste: false,
          idExistente: null,
          marcada: true,
          fora: true,
        }]);
        renderMetas(id);
        const campo = document.querySelector('.m-nome[data-i="' + (metasPropostas.length - 1) + '"]');
        if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
      }

      function removerMeta(id, i) {
        guardarEdicoes();
        metasPropostas = metasPropostas.filter(function (_, j) { return j !== i; });
        renderMetas(id);
      }

      /** Redesenhar a tabela apaga os inputs; salva o que foi digitado antes. */
      function guardarEdicoes() {
        metasPropostas = metasEditadas(true);
      }

      /**
       * Nome livre vira evento estável. É a chave de deduplicação da conversão,
       * então não pode mudar depois — e por isso só é derivado uma vez, quando a
       * meta ainda não tem evento.
       */
      function eventoDoNome(nome) {
        return String(nome || '')
          .replace(/^CRM\s*-\s*/i, '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '_')
          .replace(/^_+|_+$/g, '');
      }

      // A etapa que dispara cada meta muda de cliente para cliente, entao a
      // sugestão vem como escolha, não como texto fixo.
      function seletorEtapa(m, i) {
        if (m.evento === 'conversa') return '<span class="motivo">primeira mensagem</span>';
        const opts = (m.etapasPossiveis || [])
          .map(function (e) {
            return '<option value="' + e.id + '"' + (e.id === m.stageId ? ' selected' : '') + '>' + esc(e.nome) + '</option>';
          }).join('');
        return '<select class="m-stage" data-i="' + i + '"><option value="">(nenhuma)</option>' + opts + '</select>';
      }

      /** `tudo` mantém as desmarcadas — usado ao redesenhar, não ao publicar. */
      function metasEditadas(tudo) {
        function ler(cls, i) { return document.querySelector('.' + cls + '[data-i="' + i + '"]'); }
        return metasPropostas
          .map(function (m, i) {
            const marcada = ler('m-on', i).checked;
            if (!marcada && !tudo) return null;
            const valor = ler('m-valor', i).value.trim();
            const nome = ler('m-nome', i).value.trim();
            return Object.assign({}, m, {
              nome: nome,
              marcada: marcada,
              // uma meta do catálogo mantém o evento; a adicionada à mão o ganha
              // do nome, e só na primeira vez
              evento: m.evento || eventoDoNome(nome),
              categoria: ler('m-cat', i).value,
              valor: valor === '' ? null : Number(valor),
              contagem: ler('m-cont', i).value,
              janelaClique: Number(ler('m-jc', i).value) || 30,
              stageId: m.evento === 'conversa'
                ? null
                : (Number(ler('m-stage', i).value) || null),
            });
          })
          .filter(Boolean);
      }

      async function publicarMetas(id, validar) {
        const estado = document.getElementById('metas-estado');
        const metas = metasEditadas();
        if (!metas.length) { estado.textContent = 'nenhuma meta marcada'; return; }
        const semNome = metas.find(function (m) { return !m.evento; });
        if (semNome) { estado.textContent = 'meta sem nome utilizável: "' + semNome.nome + '"'; return; }
        const eventos = metas.map(function (m) { return m.evento; });
        const repetido = eventos.find(function (e, i) { return eventos.indexOf(e) !== i; });
        if (repetido) { estado.textContent = 'duas metas com o mesmo nome (' + repetido + ')'; return; }
        estado.textContent = validar ? 'validando no Google…' : 'publicando…';
        try {
          const r = await enviar('/tenants/' + id + '/metas', 'POST', { metas: metas, validar: validar });
          estado.textContent = validar
            ? 'validado: ' + r.seriam_criadas + ' seriam criadas, nada foi gravado'
            : r.criadas + ' criadas · ' + r.ligadas + ' ligadas a etapas';
          if (!validar) { await preverMetas(id); await carregarEtapas(id); }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      /**
       * Liga e desliga o envio de conversao ao Google Ads.
       *
       * `validate_only` no banco: ligado, o Google valida e NAO grava. O switch
       * mostra o inverso disso — o que a pessoa quer saber e' "está enviando?".
       *
       * Armar pede confirmação porque é o único botão do painel que faz dado
       * sair para fora e não dá para desfazer: conversão gravada no Google Ads
       * não volta atrás.
       */
      async function montarSwitchEnvio(id) {
        const sw = document.getElementById('sw-envio');
        const rot = document.getElementById('sw-rotulo');
        if (!sw) return;

        const pintar = function (enviando) {
          sw.checked = enviando;
          rot.textContent = enviando ? 'Enviando ao Google Ads' : 'Modo sombra';
          rot.className = 'rotulo ' + (enviando ? 'st-erro' : 'motivo');
        };

        let cfg;
        try {
          cfg = await api('/tenants/' + id + '/config');
        } catch (e) {
          rot.textContent = 'não foi possível ler a configuração';
          sw.disabled = true;
          return;
        }
        pintar(!cfg.validate_only);

        sw.addEventListener('change', async function () {
          const armar = sw.checked;
          if (armar && !confirm(
            'Ligar o envio faz a conversão ser GRAVADA no Google Ads, de verdade.\n\n' +
            'Antes disso o histórico da aba Conversoes precisa estar importado — ' +
            'senão o que o n8n já mandou vai de novo, e conversão gravada não volta atrás.\n\n' +
            'Ligar mesmo assim?')) {
            pintar(false);
            return;
          }
          sw.disabled = true;
          rot.textContent = 'salvando…';
          try {
            await enviar('/tenants/' + id, 'PATCH', { validate_only: armar ? 0 : 1 });
            pintar(armar);
          } catch (e) {
            pintar(!armar);
            rot.textContent = 'falhou: ' + e.message;
          } finally {
            sw.disabled = false;
          }
        });
      }

      /**
       * Roda o pipeline de hoje sobre os webhooks já recebidos.
       *
       * Os eventos foram gravados enquanto o pipeline não existia e ficaram
       * como `ignorado`. Reenfileirar corrige o passado usando o mesmo código
       * que roda em produção — não um script paralelo que divergiria dele.
       *
       * Um evento por conversa, o mais antigo: é a mensagem que traz o
       * protocolo. As outras 40 da mesma conversa dariam o mesmo resultado
       * gastando 40 vezes mais chamadas.
       */
      async function reprocessar(id, aplicar) {
        const estado = document.getElementById('reproc-estado');
        if (aplicar && !confirm(
          'Isto escreve no Chatwoot de verdade: protocolo, UTMs e etiquetas nas ' +
          'conversas que ainda não têm.\n\nConversa que já tem protocolo é pulada.\n\nReprocessar?')) {
          return;
        }
        const botoes = ['btn-reproc', 'btn-reproc-aplicar'].map(function (x) { return document.getElementById(x); });
        botoes.forEach(function (b) { if (b) b.disabled = true; });
        const girar = function (texto) {
          estado.innerHTML = '<span class="girando"></span>' + esc(texto);
        };
        girar(aplicar ? 'enfileirando…' : 'conferindo…');

        try {
          const r = await enviar(
            '/tenants/' + id + '/reprocessar' + (aplicar ? '?aplicar=1' : ''), 'POST', {});

          if (r.previa) {
            estado.textContent = r.na_fila + ' conversa(s) sem atribuição';
            return;
          }
          if (!r.na_fila) {
            estado.textContent = 'nada para reprocessar';
            return;
          }

          // A fila é assíncrona: o POST só enfileira. Acompanhar até acabar
          // evita o usuário recarregar no escuro sem saber se terminou.
          girar(r.na_fila + ' na fila · processando…');
          const alvo = r.na_fila;
          for (let i = 1; i <= 15; i++) {
            await new Promise(function (ok) { setTimeout(ok, 2000); });
            let restam;
            try {
              restam = (await enviar('/tenants/' + id + '/reprocessar', 'POST', {})).na_fila;
            } catch { continue; }
            girar('processando… ' + Math.max(alvo - restam, 0) + ' de ' + alvo);
            if (restam < alvo) break;
          }
          estado.textContent = 'reprocessado';
          await carregarEventos(id, 0);
          await carregarAvisos(id, 0);
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        } finally {
          botoes.forEach(function (b) { if (b) b.disabled = false; });
        }
      }

      /**
       * Controles de página.
       *
       * Só aparecem quando há mais de uma página: numa lista de 8 itens, dois
       * botões inertes só ocupam espaço e sugerem que existe algo adiante.
       */
      function paginacao(id, total, limite, offset) {
        if (total <= limite) return '';
        const pagina = Math.floor(offset / limite) + 1;
        const paginas = Math.ceil(total / limite);
        return '<div class="paginacao">' +
          '<button class="pag" data-alvo="' + id + '" data-offset="' + Math.max(offset - limite, 0) + '"' +
            (offset <= 0 ? ' disabled' : '') + '>← anterior</button>' +
          '<span class="carregando">' + (offset + 1) + '–' + Math.min(offset + limite, total) +
            ' de ' + total + ' · página ' + pagina + ' de ' + paginas + '</span>' +
          '<button class="pag" data-alvo="' + id + '" data-offset="' + (offset + limite) + '"' +
            (offset + limite >= total ? ' disabled' : '') + '>próxima →</button>' +
          '</div>';
      }

      function ligarPaginacao(alvo, recarregar) {
        alvo.querySelectorAll('.pag').forEach(function (b) {
          b.addEventListener('click', function () { recarregar(Number(b.dataset.offset)); });
        });
      }

      // ---------- etiquetas do cliente ----------

      /**
       * As etiquetas da conta do Chatwoot cruzadas com o vocabulário do motor.
       *
       * São coisas diferentes: a etiqueta existe no Chatwoot, mas o motor só
       * aplica o que está no vocabulário. A que o vendedor criou à mão ("Ligar
       * mais tarde") aparece fora do vocabulário, e é assim que deve ficar —
       * não é etiqueta de atribuição.
       */
      async function carregarEtiquetas(id) {
        const alvo = document.getElementById('etiquetas');
        const estado = document.getElementById('etiquetas-estado');
        if (!alvo) return;
        alvo.innerHTML = '<p class="carregando">carregando…</p>';

        let r;
        try {
          r = await api('/tenants/' + id + '/etiquetas');
        } catch (e) {
          alvo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
          return;
        }

        const noVocab = r.etiquetas.filter(function (e) { return e.no_vocabulario; }).length;
        estado.textContent =
          r.etiquetas.length + ' no Chatwoot · ' + noVocab + ' no vocabulário' +
          (r.instancia ? ' · WhatsApp "' + r.instancia + '"' : ' · sem instância de WhatsApp');

        const optZap = function (atual) {
          return '<option value="">— não aplica no WhatsApp —</option>' +
            r.whatsapp_disponiveis.map(function (l) {
              return '<option value="' + esc(l) + '"' + (l === atual ? ' selected' : '') + '>' + esc(l) + '</option>';
            }).join('');
        };

        alvo.innerHTML =
          (r.orfas.length
            ? '<div class="aviso">No vocabulário mas não existem no Chatwoot: <span class="mono">' +
              esc(r.orfas.join(', ')) + '</span>. O motor tentaria aplicar e falharia.</div>'
            : '') +
          (r.etiquetas.length
            ? '<table><thead><tr><th>Etiqueta</th><th>O motor usa</th><th>Nome no WhatsApp</th></tr></thead><tbody>' +
              r.etiquetas.map(function (e) {
                return '<tr>' +
                  '<td class="mono">' + esc(e.titulo) + '</td>' +
                  '<td><input type="checkbox" class="l-on" data-slug="' + esc(e.titulo) + '" ' +
                    (e.no_vocabulario ? 'checked' : '') + ' /></td>' +
                  '<td>' + (r.whatsapp_disponiveis.length
                    ? '<select class="l-zap" data-slug="' + esc(e.titulo) + '"' +
                      (e.no_vocabulario ? '' : ' disabled') + '>' + optZap(e.label_whatsapp) + '</select>'
                    : '<span class="nada">' + esc(e.label_whatsapp || '—') + '</span>') +
                  '</td></tr>';
              }).join('') + '</tbody></table>'
            : '<div class="vazio"><p>Nenhuma etiqueta nesta conta do Chatwoot.</p>' +
              '<p class="mono">Use Integrações → Gerar no Chatwoot para criar as do padrão.</p></div>');

        alvo.querySelectorAll('.l-on').forEach(function (b) {
          b.addEventListener('change', async function () {
            const zap = alvo.querySelector('.l-zap[data-slug="' + b.dataset.slug + '"]');
            try {
              await enviar('/tenants/' + id + '/etiquetas/' + encodeURIComponent(b.dataset.slug), 'PATCH', {
                no_vocabulario: b.checked,
                label_whatsapp: zap ? zap.value : null,
              });
              if (zap) zap.disabled = !b.checked;
              carregarEtiquetas(id);
            } catch (e) { estado.textContent = 'falhou: ' + e.message; }
          });
        });

        alvo.querySelectorAll('.l-zap').forEach(function (sel) {
          sel.addEventListener('change', async function () {
            try {
              await enviar('/tenants/' + id + '/etiquetas/' + encodeURIComponent(sel.dataset.slug), 'PATCH', {
                no_vocabulario: true,
                label_whatsapp: sel.value,
              });
              estado.textContent = 'salvo';
            } catch (e) { estado.textContent = 'falhou: ' + e.message; }
          });
        });
      }

      async function criarEtiqueta(id) {
        const estado = document.getElementById('etiquetas-estado');
        const slug = document.getElementById('l-slug').value.trim();
        if (!slug) { estado.textContent = 'dê um nome à etiqueta'; return; }
        estado.textContent = 'criando no Chatwoot…';
        try {
          const r = await enviar('/tenants/' + id + '/etiquetas', 'POST', {
            slug: slug,
            cor: document.getElementById('l-cor').value,
            descricao: document.getElementById('l-desc').value,
          });
          document.getElementById('l-slug').value = '';
          document.getElementById('l-desc').value = '';
          await carregarEtiquetas(id);
          if (!r.criada_no_chatwoot) {
            estado.textContent = 'já existia no Chatwoot — só foi ligada ao motor';
          }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
        }
      }

      // ---------- etiquetas e atributos ----------

      /**
       * Lê a conta e mostra o que falta. Com `aplicar`, cria.
       *
       * A prévia é de verdade: o Worker consulta o Chatwoot antes de escrever,
       * em vez de mandar criar tudo e adivinhar pelo texto do erro o que já
       * existia — que era como o fluxo do n8n fazia.
       */
      async function provisionar(id, aplicar) {
        const alvo = document.getElementById('prov');
        const estado = document.getElementById('prov-estado');
        if (!alvo) return;
        estado.textContent = aplicar ? 'criando no Chatwoot…' : 'conferindo a conta…';
        alvo.innerHTML = '';

        let r;
        try {
          r = await enviar('/tenants/' + id + '/provisionar' + (aplicar ? '?aplicar=1' : ''), 'POST', {});
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;
          return;
        }

        const faltando = r.etiquetas_a_criar.length + r.atributos_a_criar.length;
        estado.textContent = r.previa
          ? 'conta ' + r.conta + ' · ' + (faltando ? faltando + ' a criar' : 'tudo no padrão')
          : r.criados + ' criados' + (r.falhas.length ? ' · ' + r.falhas.length + ' falharam' : '');

        const bloco = function (titulo, itens, classe) {
          if (!itens.length) return '';
          return '<p style="margin:10px 0 4px"><strong>' + esc(titulo) + '</strong></p>' +
            '<p class="' + classe + '">' + itens.map(esc).join(' · ') + '</p>';
        };

        alvo.innerHTML =
          bloco('Etiquetas a criar', r.etiquetas_a_criar, 'mono') +
          bloco('Atributos a criar', r.atributos_a_criar, 'mono') +
          bloco('Falhas', r.falhas || [], 'st-erro') +
          '<p class="carregando" style="margin-top:10px">' +
            r.etiquetas_existentes.length + ' etiquetas e ' + r.atributos_existentes +
            ' atributos do padrão já existem nesta conta.' +
            (r.fora_do_padrao.length
              ? ' Fora do padrão, criados à mão e mantidos: ' + esc(r.fora_do_padrao.join(', ')) + '.'
              : '') +
          '</p>';
      }

      // ---------- padronizações ----------

      /**
       * O catálogo que todo cliente novo recebe.
       *
       * É o que estava colado dentro de um nó de código no n8n, com o número da
       * conta fixo em dois lugares. Aqui é lista editável, e a conta é a que
       * você escolher na hora de gerar.
       */
      async function verPadroes() {
        tela.innerHTML = '<p class="carregando">carregando…</p>';
        rodape.textContent = '';
        const r = await api('/padroes');

        const MODELOS = [
          ['contact_attribute', 'Contato', 'a atribuição mais recente da pessoa'],
          ['conversation_attribute', 'Conversa', 'a origem daquele atendimento: o lead que volta por um anúncio novo não apaga a origem da conversa antiga'],
          ['task_attribute', 'Tarefa (card)', 'a negociação — cada card carrega a própria origem'],
        ];

        tela.innerHTML =
          '<div class="voltar"><button id="btn-voltar">← Todos os clientes</button></div>' +
          '<h2 style="font-family:var(--ui);font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em">Padronizações</h2>' +
          '<p class="carregando" style="margin:0 0 24px">O que todo cliente novo recebe. Depois é um clique em <strong>Gerar no Chatwoot</strong>, na aba Integrações do cliente.</p>' +

          '<section><h2>Etiquetas</h2>' +
            '<div class="linha-acoes">' +
              '<input id="e-slug" placeholder="slug (ex: google-ads)" />' +
              '<input id="e-cor" type="color" value="#999999" style="width:52px;padding:2px" />' +
              '<input id="e-desc" placeholder="descrição" />' +
              '<button id="btn-e-add">Adicionar</button>' +
            '</div>' +
            '<table><thead><tr><th>Cor</th><th>Slug</th><th>Descrição</th><th></th></tr></thead><tbody>' +
            r.etiquetas.map(function (e) {
              return '<tr><td><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:' +
                esc(e.cor) + '"></span></td>' +
                '<td class="mono">' + esc(e.slug) + '</td>' +
                '<td class="motivo">' + esc(e.descricao || '') + '</td>' +
                '<td><button class="e-del" data-id="' + e.id + '">remover</button></td></tr>';
            }).join('') + '</tbody></table></section>' +

          MODELOS.map(function (m) {
            const linhas = r.atributos.filter(function (a) { return a.modelo === m[0]; });
            return '<section><h2>Atributos · ' + esc(m[1]) + '</h2>' +
              '<p class="carregando" style="margin:0 0 12px">' + esc(m[2]) + '</p>' +
              '<div class="linha-acoes">' +
                '<input class="a-chave" data-m="' + m[0] + '" placeholder="chave (ex: utm_id)" />' +
                '<input class="a-nome" data-m="' + m[0] + '" placeholder="nome na tela (ex: UTM ID)" />' +
                '<select class="a-tipo" data-m="' + m[0] + '">' +
                  opcoes(['text', 'number', 'currency', 'percent', 'link', 'date', 'list', 'checkbox'], 'text') +
                '</select>' +
                '<input class="a-desc" data-m="' + m[0] + '" placeholder="descrição" />' +
                '<button class="btn-a-add" data-m="' + m[0] + '">Adicionar</button>' +
              '</div>' +
              (linhas.length
                ? '<table><thead><tr><th>Chave</th><th>Nome na tela</th><th>Tipo</th><th>Descrição</th><th></th></tr></thead><tbody>' +
                  linhas.map(function (a) {
                    return '<tr><td class="mono">' + esc(a.chave) + '</td><td>' + esc(a.nome) + '</td>' +
                      '<td class="motivo">' + esc(a.tipo) + '</td>' +
                      '<td class="motivo">' + esc(a.descricao || '') + '</td>' +
                      '<td><button class="a-del" data-id="' + a.id + '">remover</button></td></tr>';
                  }).join('') + '</tbody></table>'
                : '<div class="vazio"><p>Nenhum atributo neste modelo.</p></div>') +
              '</section>';
          }).join('') +
          '<div id="padroes-erro"></div>';

        document.getElementById('btn-voltar').addEventListener('click', verOverview);

        const falhar = function (e) {
          document.getElementById('padroes-erro').innerHTML = '<div class="erro">' + esc(e.message) + '</div>';
        };

        document.getElementById('btn-e-add').addEventListener('click', async function () {
          try {
            await enviar('/padroes/etiquetas', 'POST', {
              slug: document.getElementById('e-slug').value,
              cor: document.getElementById('e-cor').value,
              descricao: document.getElementById('e-desc').value,
            });
            verPadroes();
          } catch (e) { falhar(e); }
        });

        document.querySelectorAll('.btn-a-add').forEach(function (b) {
          b.addEventListener('click', async function () {
            const m = b.dataset.m;
            const v = function (cls) { return document.querySelector('.' + cls + '[data-m="' + m + '"]').value; };
            try {
              await enviar('/padroes/atributos', 'POST', {
                modelo: m, chave: v('a-chave'), nome: v('a-nome'), tipo: v('a-tipo'), descricao: v('a-desc'),
              });
              verPadroes();
            } catch (e) { falhar(e); }
          });
        });

        document.querySelectorAll('.e-del').forEach(function (b) {
          b.addEventListener('click', async function () {
            try { await enviar('/padroes/etiquetas/' + b.dataset.id, 'DELETE'); verPadroes(); }
            catch (e) { falhar(e); }
          });
        });
        document.querySelectorAll('.a-del').forEach(function (b) {
          b.addEventListener('click', async function () {
            try { await enviar('/padroes/atributos/' + b.dataset.id, 'DELETE'); verPadroes(); }
            catch (e) { falhar(e); }
          });
        });
      }

      document.getElementById('btn-padroes').addEventListener('click', () => verPadroes());
      document.getElementById('btn-novo').addEventListener('click', () => verFormulario());

      document.getElementById('btn-atualizar').addEventListener('click', verOverview);

      verOverview().catch((e) => {
        tela.innerHTML =
          e.message === 'sem-acesso'
            ? `<div class="vazio">
                 <p>Este painel exige login pelo Cloudflare Access.</p>
                 <p class="mono">Crie uma aplicação do Access para este domínio e cadastre o <code>aud</code> dela em CF_ACCESS_AUD.</p>
               </div>`
            : `<div class="vazio"><p>Não foi possível carregar.</p><p class="mono">${esc(e.message)}</p></div>`;
      });
    </script>
  </body>
</html>
