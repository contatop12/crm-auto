<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P12 CRM Auto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------------------------------------------------------------
         P12 CRM Auto — painel de operação.

         Lido muitas vezes por dia, procurando o que saiu do lugar. Por isso:

         1. Cor só significa status. Nada é colorido por decoração.
         2. Mono é identificador de máquina; sans é palavra escrita por gente.
         3. Seção é régua e espaço, não caixa. Caixa só onde o agrupamento
            é real — a linha de um cliente.
         4. Um tratamento de carregamento só: barra fina sob o título.
         5. Movimento responde a uma ação. Nada anima sozinho.
         --------------------------------------------------------------- */

      :root {
        --papel: #fbfaf8;
        --carta: #ffffff;
        --tinta: #17191c;
        --tinta-2: #5b646e;
        --tinta-3: #98a1aa;
        --linha: #e6e3de;
        --linha-forte: #d4d0c9;

        /* status — as únicas cores saturadas da tela */
        --fluxo: #0b6e63;
        --espera: #9a5b12;
        --falha: #a32b20;
        --parado: #c2bdb4;

        --ui: 'Archivo', ui-sans-serif, system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

        --r: 5px;
        --sombra: 0 1px 2px rgba(23, 25, 28, .04), 0 1px 1px rgba(23, 25, 28, .03);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--papel);
        color: var(--tinta);
        font: 14px/1.55 var(--ui);
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- barra superior ---------- */

      .topo {
        position: sticky; top: 0; z-index: 30;
        display: flex; align-items: center; gap: 24px;
        padding: 0 24px; height: 56px;
        background: rgba(251, 250, 248, .92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--linha);
      }
      .marca {
        display: flex; align-items: center; gap: 9px;
        font-weight: 700; font-size: 15px; letter-spacing: -.015em;
        white-space: nowrap;
      }
      .marca svg { color: var(--fluxo); }

      .menu { display: flex; gap: 2px; margin-right: auto; }
      .menu button {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 11px; border: 0; border-radius: var(--r);
        background: none; color: var(--tinta-2);
        font: inherit; font-size: 13px; cursor: pointer;
      }
      .menu button:hover { background: rgba(23, 25, 28, .05); color: var(--tinta); }
      .menu button[aria-current='page'] { background: var(--tinta); color: #fff; }
      .menu button[aria-current='page'] svg { color: #fff; }

      .relogio {
        font-family: var(--mono); font-size: 12px; color: var(--tinta-3);
        white-space: nowrap;
      }

      main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 96px; }

      /* ---------- tipografia ---------- */

      h1 { font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 2px; }
      h2 {
        font-size: 15px; font-weight: 650; letter-spacing: -.01em;
        margin: 0; color: var(--tinta);
      }
      .sub-titulo { color: var(--tinta-2); font-size: 13px; margin: 0; }
      .id { font-family: var(--mono); font-size: 12px; color: var(--tinta-3); }
      .dica { color: var(--tinta-2); font-size: 12.5px; margin: 5px 0 0; max-width: 62ch; }
      .carregando { color: var(--tinta-3); font-size: 13px; }
      .motivo { color: var(--tinta-2); }
      .mono { font-family: var(--mono); font-size: 12px; }
      .nada { color: var(--tinta-3); }
      .sub {
        display: block; font-family: var(--mono); font-size: 11px;
        color: var(--tinta-3); margin-top: 2px;
      }

      /* ---------- seção sanfonada ---------- */

      section { border-top: 1px solid var(--linha); }
      section:first-of-type { border-top: 0; }

      .cabeca {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 18px 0 16px; border: 0; background: none;
        font: inherit; text-align: left; cursor: pointer; color: inherit;
      }
      .cabeca .seta { color: var(--tinta-3); transition: transform .18s ease; flex: none; }
      .cabeca[aria-expanded='false'] .seta { transform: rotate(-90deg); }
      .cabeca .conta {
        margin-left: auto; font-family: var(--mono); font-size: 12px;
        color: var(--tinta-3); flex: none;
      }
      .corpo-secao { padding-bottom: 26px; }
      .corpo-secao[hidden] { display: none; }

      /* Barra de carregamento: um tratamento só, em toda a tela. */
      .barra { height: 2px; background: var(--linha); overflow: hidden; border-radius: 2px; }
      .barra::after {
        content: ''; display: block; height: 100%; width: 40%;
        background: var(--fluxo); border-radius: 2px;
        animation: corre 1.1s cubic-bezier(.6, 0, .4, 1) infinite;
      }
      @keyframes corre {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .barra::after { animation-duration: 3s; }
      }

      /* ---------- controles ---------- */

      button, select, input {
        font: inherit; color: var(--tinta);
        border: 1px solid var(--linha-forte); border-radius: var(--r);
        background: var(--carta); padding: 6px 11px;
      }
      button { cursor: pointer; box-shadow: var(--sombra); }
      button:hover:not(:disabled) { border-color: var(--tinta-3); }
      button:disabled { opacity: .45; cursor: default; box-shadow: none; }
      button.principal { background: var(--tinta); border-color: var(--tinta); color: #fff; }
      button.principal:hover:not(:disabled) { background: #000; }
      button.perigo { color: var(--falha); border-color: var(--falha); background: var(--carta); }

      input, select { box-shadow: none; }
      input::placeholder { color: var(--tinta-3); }
      :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

      .linha-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .campo { margin-bottom: 14px; }
      .campo label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 5px; }
      .campo input, .campo select { width: 100%; }
      .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 18px; }

      /* Ícone dentro de botão: alinhado à baseline visual do texto. */
      button svg, .marca svg, .menu svg { flex: none; vertical-align: -2px; }

      /* ---------- dica flutuante ---------- */

      [data-dica] { position: relative; }
      [data-dica]::after {
        content: attr(data-dica);
        position: absolute; bottom: calc(100% + 7px); left: 50%;
        transform: translateX(-50%);
        background: var(--tinta); color: #fff;
        font: 12px/1.4 var(--ui); white-space: nowrap;
        padding: 5px 9px; border-radius: 4px;
        opacity: 0; pointer-events: none; transition: opacity .12s;
        z-index: 40;
      }
      [data-dica]:hover::after, [data-dica]:focus-visible::after { opacity: 1; }

      /* ---------- tabela ---------- */

      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left; font-size: 11.5px; font-weight: 600;
        color: var(--tinta-3); padding: 0 12px 8px 0;
        border-bottom: 1px solid var(--linha);
        white-space: nowrap;
      }
      td {
        padding: 11px 12px 11px 0; border-bottom: 1px solid var(--linha);
        vertical-align: top; font-size: 13px;
      }
      tr:last-child td { border-bottom: 0; }
      tr.clicavel { cursor: pointer; }
      tr.clicavel:hover td { background: rgba(23, 25, 28, .025); }

      .st-ok, .st-enviado { color: var(--fluxo); }
      .st-erro { color: var(--falha); }
      .st-ignorado, .st-recebido { color: var(--espera); }

      .tag {
        display: inline-block; padding: 1px 6px; border-radius: 3px;
        border: 1px solid var(--linha-forte); color: var(--tinta-2);
        font-size: 11.5px; line-height: 16px; white-space: nowrap;
      }
      .tag-novo { border-color: var(--fluxo); color: var(--fluxo); }
      .tag-anuncio, .tag-repetido { border-color: var(--espera); color: var(--espera); }

      /* ---------- clientes ---------- */

      .cliente {
        display: block; width: 100%; text-align: left;
        background: var(--carta); border: 1px solid var(--linha);
        border-radius: 8px; padding: 16px 18px; margin-bottom: 10px;
        box-shadow: var(--sombra); cursor: pointer;
      }
      .cliente:hover { border-color: var(--tinta-3); }
      .cliente .topo-linha { display: flex; align-items: baseline; gap: 10px; }
      .cliente .nome { font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
      .cliente .sinal { margin-left: auto; font-size: 11.5px; font-weight: 600; }
      .cliente .numeros {
        margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--tinta-2);
        display: flex; gap: 18px; flex-wrap: wrap;
      }

      /* A trilha é a assinatura da tela: um tick por webhook, do mais velho
         ao mais novo. É o que se olha primeiro para saber se algo travou. */
      .trilha { display: flex; gap: 2px; margin: 12px 0 0; height: 22px; align-items: flex-end; }
      .tick { width: 5px; height: 100%; border-radius: 1px; background: var(--parado); }
      .tick-ok { background: var(--fluxo); }
      .tick-erro { background: var(--falha); height: 100%; }
      .tick-ignorado, .tick-recebido { background: var(--espera); height: 62%; }

      /* ---------- abas ---------- */

      .abas {
        display: flex; gap: 2px; border-bottom: 1px solid var(--linha);
        margin: 20px 0 4px; overflow-x: auto;
      }
      .aba {
        border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        background: none; box-shadow: none;
        padding: 9px 13px; color: var(--tinta-2); font-size: 13.5px; white-space: nowrap;
      }
      .aba:hover { color: var(--tinta); border-color: var(--linha-forte); }
      .aba[aria-selected='true'] { color: var(--tinta); border-color: var(--tinta); font-weight: 600; }

      /* ---------- avisos e vazios ---------- */

      .aviso, .erro {
        border-left: 3px solid var(--espera); background: rgba(154, 91, 18, .05);
        padding: 11px 14px; border-radius: 0 var(--r) var(--r) 0;
        font-size: 13px; color: var(--tinta-2); margin: 14px 0 0;
      }
      .erro { border-color: var(--falha); background: rgba(163, 43, 32, .05); color: var(--falha); }

      .vazio {
        text-align: center; padding: 40px 20px; color: var(--tinta-2);
        border: 1px dashed var(--linha-forte); border-radius: 8px;
      }
      .vazio p { margin: 0 0 6px; }
      .vazio .mono { color: var(--tinta-3); }

      pre {
        background: var(--carta); border: 1px solid var(--linha); border-radius: var(--r);
        padding: 14px; overflow: auto; max-height: 460px;
        font: 12px/1.6 var(--mono); margin: 12px 0 0;
      }

      /* ---------- paginação ---------- */

      .paginacao { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
      .paginacao label { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; font-size: 12.5px; color: var(--tinta-3); }
      .paginacao select { padding: 4px 7px; font-size: 12.5px; }

      /* ---------- gaveta ---------- */

      .gaveta-fundo {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(23, 25, 28, .3);
        display: flex; justify-content: flex-end;
      }
      .gaveta {
        width: min(640px, 96vw); height: 100%; background: var(--papel);
        border-left: 1px solid var(--linha-forte);
        display: flex; flex-direction: column;
        box-shadow: -12px 0 40px rgba(0, 0, 0, .1);
        animation: entra .2s cubic-bezier(.2, .8, .3, 1);
      }
      @keyframes entra { from { transform: translateX(24px); opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .gaveta { animation: none; } }

      .gaveta header {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 16px 20px; border-bottom: 1px solid var(--linha);
      }
      .gaveta .fechar { border: 0; background: none; box-shadow: none; padding: 6px; color: var(--tinta-2); }
      .gaveta .lista { max-height: 36%; overflow-y: auto; border-bottom: 1px solid var(--linha); }
      .gaveta .item {
        display: grid; gap: 2px 10px; width: 100%; text-align: left;
        grid-template-columns: max-content max-content 1fr;
        padding: 10px 20px; border: 0; border-bottom: 1px solid var(--linha);
        border-radius: 0; background: none; box-shadow: none;
      }
      .gaveta .item:hover { background: rgba(23, 25, 28, .03); }
      .gaveta .item.ativo { background: var(--carta); box-shadow: inset 3px 0 0 var(--tinta); }
      .gaveta .item .quando { font-family: var(--mono); font-size: 12px; }
      .gaveta .item .sub { grid-column: 1 / -1; }
      .gaveta .corpo { flex: 1; overflow-y: auto; padding: 18px 20px; }
      .gaveta .corpo pre { max-height: none; }

      /* ---------- endereços e resumo ---------- */

      .endereco { margin-bottom: 18px; }
      .endereco .rotulo { font-weight: 600; font-size: 13px; margin-bottom: 5px; }
      .endereco .linha { display: flex; gap: 8px; }
      .endereco code {
        flex: 1; font: 12px/1.5 var(--mono);
        background: var(--carta); border: 1px solid var(--linha); border-radius: var(--r);
        padding: 8px 10px; overflow-x: auto; white-space: nowrap; user-select: all;
      }
      .endereco .uso { margin-top: 5px; }

      dl.resumo {
        display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px;
        margin: 0 0 14px; font-size: 12.5px;
      }
      dl.resumo dt { color: var(--tinta-3); }
      dl.resumo dd { margin: 0; font-family: var(--mono); }

      /* ---------- interruptor ---------- */

      .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch .trilho {
        width: 38px; height: 21px; border-radius: 11px;
        background: var(--parado); border: 1px solid var(--linha-forte);
        position: relative; transition: background .15s;
      }
      .switch .trilho::after {
        content: ''; position: absolute; top: 2px; left: 2px;
        width: 15px; height: 15px; border-radius: 50%;
        background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3);
        transition: transform .15s;
      }
      .switch input:checked + .trilho { background: var(--falha); border-color: var(--falha); }
      .switch input:checked + .trilho::after { transform: translateX(17px); }
      .switch input:focus-visible + .trilho { outline: 2px solid var(--tinta); outline-offset: 2px; }
      .switch .rotulo { font-size: 13px; }

      a.botao-link {
        display: inline-block; text-decoration: none; font: inherit;
        padding: 6px 13px; border-radius: var(--r);
        background: var(--tinta); color: #fff;
      }

      .voltar { margin-bottom: 16px; }
      .cliente-slug { font-family: var(--mono); font-size: 12.5px; color: var(--tinta-3); }

      /* ---------------------------------------------------------------
         Nomes que o JS já usava. Renomeei no CSS e esqueci de acompanhar no
         código — a tela do cliente ficou sem layout nenhum. Ficam com os
         nomes originais, no sistema novo.
         --------------------------------------------------------------- */

      .wrap { min-height: 100%; }
      .painel[hidden] { display: none; }

      .cliente-topo { display: flex; align-items: baseline; gap: 10px; }
      .cliente-nome { font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
      .cliente-sinal { margin-left: auto; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
      .sinal-ok { color: var(--fluxo); }
      .sinal-erro { color: var(--falha); }
      .sinal-silencio { color: var(--tinta-3); }
      .cliente-stats {
        margin-top: 10px; font-family: var(--mono); font-size: 12px;
        color: var(--tinta-2); display: flex; gap: 18px; flex-wrap: wrap;
      }
      .cliente-erro { margin-top: 6px; font-size: 12.5px; color: var(--falha); }
      .trilha-vazia { color: var(--tinta-3); font-size: 12.5px; margin: 12px 0 0; }

      /* Fluxo do lead: as cinco etapas que interessam monitorar. Cada linha é
         estado + o que a etapa é + como ela funciona. */
      .checagem {
        display: flex; gap: 14px; align-items: baseline;
        padding: 11px 0; border-bottom: 1px solid var(--linha);
      }
      .checagem:last-child { border-bottom: 0; }
      .checagem-marca {
        flex: none; width: 62px; font-size: 11.5px; font-weight: 650;
        text-transform: lowercase;
      }
      .checagem-titulo { flex: none; font-weight: 550; font-size: 13.5px; }
      .checagem-detalhe { color: var(--tinta-2); font-size: 12.5px; line-height: 1.5; }
      .marca-ok { color: var(--fluxo); }
      .marca-erro { color: var(--falha); }
      .marca-aviso { color: var(--espera); }
      .marca-na { color: var(--tinta-3); }

      @media (max-width: 720px) {
        .esconder-mobile { display: none; }
        main { padding: 20px 16px 72px; }
        .topo { gap: 12px; padding: 0 16px; }
        .menu button span { display: none; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <nav class="topo" id="topo"></nav>
      <main id="tela"><div class="barra"></div></main>
    </div>

    <script>
      /**
       * Ícones. Traço de 1,5 px, 16 px de caixa, sem preenchimento — na
       * densidade desta tela um ícone cheio compete com o texto.
       * `currentColor` para herdarem a cor de status de onde estiverem.
       */
      const ICONES = {
        fluxo: 'M3 12h4l3-7 4 14 3-7h4',
        clientes: 'M3 5h18M3 12h18M3 19h12',
        padroes: 'M4 7h16M4 12h16M4 17h9M18.5 15.5l2 2 3-3.5',
        google: 'M12 3a9 9 0 100 18 9 9 0 000-18zM3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 000 18M12 3a14 14 0 010 18',
        mais: 'M12 5v14M5 12h14',
        seta: 'M6 9l6 6 6-6',
        editar: 'M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4',
        conferir: 'M20 6L9 17l-5-5',
        atualizar: 'M21 12a9 9 0 11-3-6.7M21 4v5h-5',
        raio: 'M13 2L4 14h7l-1 8 9-12h-7l1-8z',
        fechar: 'M6 6l12 12M18 6L6 18',
        anterior: 'M15 18l-6-6 6-6',
        proxima: 'M9 6l6 6-6 6',
        alerta: 'M12 9v4M12 17h.01M10.3 4l-8 14a2 2 0 001.7 3h16a2 2 0 001.7-3l-8-14a2 2 0 00-3.4 0z',
      };

      function ic(nome, tam) {
        const d = ICONES[nome];
        if (!d) return '';
        const t = tam || 16;
        return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ' +
          'aria-hidden="true"><path d="' + d + '"/></svg>';
      }

      /**
       * Seção sanfonada.
       *
       * A tela do cliente empilha oito seções; abertas todas, a rolagem passa
       * a esconder mais do que mostra. O estado de cada uma fica no navegador,
       * porque quem abre "Etiquetas" toda vez quer ela aberta amanhã também.
       */
      /**
       * Transforma `<section><h2>` em sanfona, depois de renderizado.
       *
       * Agir sobre o DOM em vez de reescrever os oito blocos de template deixa
       * o conteúdo de cada seção onde estava. O estado de aberta fica no
       * navegador: quem abre "Etiquetas" toda vez quer ela aberta amanhã.
       */
      function sanfonar(raiz) {
        (raiz || document).querySelectorAll('section > h2').forEach(function (h) {
          const sec = h.parentElement;
          if (sec.dataset.sanfona) return;
          sec.dataset.sanfona = '1';

          const chave = (h.textContent || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40);
          let aberta = true;
          try {
            const v = localStorage.getItem('sec:' + chave);
            if (v !== null) aberta = v === '1';
          } catch { /* sem armazenamento: abre */ }

          const corpo = document.createElement('div');
          corpo.className = 'corpo-secao';
          while (h.nextSibling) corpo.appendChild(h.nextSibling);

          const cabeca = document.createElement('button');
          cabeca.className = 'cabeca';
          cabeca.setAttribute('aria-expanded', String(aberta));
          cabeca.innerHTML = '<span class="seta">' + ic('seta') + '</span>' +
            '<h2>' + esc(h.textContent || '') + '</h2>';

          h.remove();
          sec.appendChild(cabeca);
          sec.appendChild(corpo);
          corpo.hidden = !aberta;

          cabeca.addEventListener('click', function () {
            const abrir = cabeca.getAttribute('aria-expanded') !== 'true';
            cabeca.setAttribute('aria-expanded', String(abrir));
            corpo.hidden = !abrir;
            try { localStorage.setItem('sec:' + chave, abrir ? '1' : '0'); }
            catch { /* segue sem lembrar */ }
          });
        });
      }

      /** Um tratamento de carregamento só, em toda a tela. */
      const CARREGANDO = '<div class="barra"></div>';

      // A barra superior e' montada aqui porque usa os icones, que sao JS.
      document.getElementById('topo').innerHTML =
        '<span class="marca">' + ic('fluxo', 18) + ' P12 CRM Auto</span>' +
        '<div class="menu">' +
          '<button id="btn-atualizar" aria-current="page" data-dica="Voltar a lista de clientes">' + ic('clientes') + '<span>Clientes</span></button>' +

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      /**
       * "Failed to fetch" quase sempre e' a sessao do Access que venceu.
       *
       * Quando ela vence, a Cloudflare responde com um redirect para o dominio
       * de login. O navegador barra esse salto no fetch e devolve um TypeError
       * seco — sem status, sem corpo. A tela mostrava "Failed to fetch" em cada
       * seccao, que nao diz o que fazer.
       */
      async function api(caminho) {
        let r;
        try {
          r = await fetch('/api' + caminho);
        } catch {
          throw new Error('sessão expirou — recarregue a página (F5)');
        }
        if (r.redirected || /cloudflareaccess\.com/.test(r.url)) {
          throw new Error('sessão expirou — recarregue a página (F5)');
        }
        if (r.status === 401) throw new Error('sem-acesso');
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
        return r.json();
      }

      function haQuanto(iso) {
        if (!iso) return 'nunca';
        const seg = (Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime()) / 1000;
        if (seg < 90) return 'há instantes';
        if (seg < 5400) return 'há ' + Math.round(seg / 60) + ' min';
        if (seg < 172800) return 'há ' + Math.round(seg / 3600) + ' h';
        return 'há ' + Math.round(seg / 86400) + ' dias';
      }

      const hora = (iso) =>
        !iso ? '' : new Date(iso.replace(' ', 'T') + 'Z').toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });

        // ({ linhas, total }), nao um array — o `?? []` cobre tanto a falha
        // quanto uma resposta em formato inesperado.
        const trilhas = await Promise.all(
          clientes.map((c) =>
            api('/tenants/' + c.tenant_id + '/events?limit=40')
              .then((r) => r.linhas ?? [])
              .catch(() => []),
          ),
        );

        tela.innerHTML = clientes
          .map((c, i) => {
            // eventos vêm do mais novo para o mais velho; a trilha lê ao contrário
            const ticks = trilhas[i]
              .slice()
              .reverse()
              .map(
                (e, j) =>
                  `<span class="tick tick-${esc(e.status)}" style="animation-delay:${j * 8}ms" title="${esc(
                    e.event_type,
                  )} · ${esc(e.status)}${e.motivo ? ' · ' + esc(e.motivo) : ''}"></span>`,
              )
              .join('');

            const rotulo = { ok: 'operando', erro: 'com erro', silencio: 'sem eventos' }[c.sinal];

            return `
            <button class="cliente" data-id="${c.tenant_id}">

                <span class="cliente-slug">${esc(c.slug)}</span>
                <span class="cliente-sinal sinal-${c.sinal}">${rotulo}</span>
              </div>
              <div class="trilha">${ticks || '<span class="trilha-vazia">sem eventos registrados</span>'}</div>
              <div class="cliente-stats">
                <b>${c.recebidos_24h}</b> em 24h · <b>${c.erros_24h}</b> ${

                · último evento ${haQuanto(c.ultimo_evento_em)}
                ${c.ultimo_erro_motivo ? `<br><span class="cliente-erro">último erro: ${esc(c.ultimo_erro_motivo)}</span>` : ''}
              </div>
            </button>`;

        rodape.textContent = clientes.length + ' clientes · ' + new Date().toLocaleTimeString('pt-BR');

      async function ingestAlcancavel(slug) {

      async function mudarWebhook(id, slug, metodo) {
        const estado = document.getElementById('webhook-estado');
        const botao = document.getElementById('btn-webhook');
        botao.disabled = true;

        if (metodo === 'POST') {
          estado.textContent = 'conferindo se a rota de ingestão está pública…';
          if (!(await ingestAlcancavel(slug))) {
            estado.textContent =
              'a rota /ingest está atrás do Access — o Chatwoot receberia a tela de login. Crie um app do Access com política Bypass para o path ingest.';
            botao.disabled = false;
            return;
          }
        }

        estado.textContent = metodo === 'POST' ? 'registrando…' : 'removendo…';
        try {
          const r = await fetch('/api/tenants/' + id + '/webhook', { method: metodo });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
          await carregarWebhooks(id, slug);
          if (metodo === 'POST') {
            document.getElementById('webhook-estado').textContent =
              (j.adotado ? 'adotado o que já existia' : 'registrado') +
              ' · assinatura ' + j.assinatura +
              (j.aviso ? ' · ' + j.aviso : '');
          }
        } catch (e) {
          estado.textContent = 'falhou: ' + e.message;

          botao.disabled = false;

        } catch (e) {

      /**
       * Junta linhas repetidas do mesmo evento.
       *
       * O coletor do GTM dispara várias vezes por clique e o Chatwoot manda um
       * webhook por mensagem: uma conversa de 40 mensagens ocupava a lista
       * inteira. Agrupado, cada assunto ocupa uma linha e o detalhe fica a um
       * clique.
       *
       * Agrupa apenas linhas CONSECUTIVAS: a lista é cronológica, e juntar
       * coisas separadas por horas esconderia que houve um intervalo.
       */
      function agrupar(linhas) {
        const chave = function (e) {
          const r = e.resumo || {};
          // o que identifica "o mesmo assunto": o clique pelo protocolo, a
          // conversa pelo id. Sem nenhum dos dois, a linha fica sozinha.
          const alvo = e.source === 'click' ? r.protocolo : r.conversaId;
          return alvo ? e.event_type + '|' + alvo + '|' + e.status : null;
        };

        const grupos = [];
        for (const e of linhas) {
          const k = chave(e);
          const ultimo = grupos[grupos.length - 1];
          if (k && ultimo && ultimo.chave === k) {
            ultimo.itens.push(e);
          } else {
            grupos.push({ chave: k, itens: [e] });
          }
        }
        return grupos;
      }

      function linhaGrupo(g, indice) {
        if (g.itens.length === 1) return linhaEvento(g.itens[0]);

        const e = g.itens[0];
        const r = e.resumo || {};
        const nada = '<span class="nada">—</span>';
        const alvo = e.source === 'click' ? r.protocolo : 'conversa ' + r.conversaId;

        return '<tr class="clicavel grupo" data-grupo="' + indice + '">' +
          '<td title="' + esc(hora(e.received_at)) + '">' + haQuanto(e.received_at) +
            '<span class="sub">' + g.itens.length + ' seguidos</span></td>' +
          '<td>' + esc(e.pipeline || e.event_type) +
            '<span class="sub">' + esc(e.source) + ' · ' + esc(e.event_type) + '</span></td>' +
          '<td>' + (r.quem ? esc(r.quem) : nada) + '</td>' +
          '<td><span class="tag tag-repetido">' + g.itens.length + '×</span>' +
            '<span class="sub">' + esc(String(alvo || '')) + '</span></td>' +
          '<td class="esconder-mobile">' + (r.board ? esc(r.board) : nada) + '</td>' +
          '<td class="st-' + esc(e.status) + '">' + esc(e.status) + '</td>' +
          '<td class="motivo esconder-mobile">' + esc(e.motivo || '') + '</td>' +
          '<td>' + (e.signature_ok === null ? '—' : e.signature_ok ? 'ok' : 'falhou') + '</td>' +
          '</tr>';
      }

      // ---------- gaveta lateral ----------

      let gavetaAberta = null;

      function abrirGaveta(tenantId, grupo) {
        fecharGaveta();

        const g = document.createElement('div');
        g.className = 'gaveta-fundo';
        g.innerHTML =
          '<aside class="gaveta" role="dialog" aria-modal="true" aria-label="Eventos do grupo">' +
            '<header>' +
              '<div><strong>' + grupo.itens.length + ' eventos seguidos</strong>' +
              '<span class="sub">' + esc(grupo.itens[0].pipeline || grupo.itens[0].event_type) + '</span></div>' +
              '<button class="fechar" aria-label="Fechar">' + ic('fechar') + '</button>' +
            '</header>' +
            '<div class="lista">' +
              grupo.itens.map(function (e, i) {
                return '<button class="item" data-ev="' + e.id + '">' +
                  '<span class="quando">' + esc(hora(e.received_at)) + '</span>' +
                  '<span class="st-' + esc(e.status) + '">' + esc(e.status) + '</span>' +
                  '<span class="motivo">' + esc(e.motivo || '') + '</span>' +
                  '<span class="sub">evento ' + e.id + ' · ' + (i + 1) + ' de ' + grupo.itens.length + '</span>' +
                  '</button>';
              }).join('') +
            '</div>' +
            '<div class="corpo"><p class="carregando">Clique num evento para ver o corpo do webhook.</p></div>' +
          '</aside>';

        document.body.appendChild(g);
        gavetaAberta = g;

        g.querySelector('.fechar').addEventListener('click', fecharGaveta);
        // clicar no fundo fecha; dentro da gaveta, não
        g.addEventListener('click', function (ev) { if (ev.target === g) fecharGaveta(); });

        g.querySelectorAll('.item').forEach(function (b) {
          b.addEventListener('click', async function () {
            g.querySelectorAll('.item').forEach(function (x) { x.classList.remove('ativo'); });
            b.classList.add('ativo');
            const corpo = g.querySelector('.corpo');
            corpo.innerHTML = '<p class="carregando">carregando…</p>';
            try {
              const r = await api('/tenants/' + tenantId + '/events/' + b.dataset.ev + '/payload');
              corpo.innerHTML =
                cabecalhoResumo(r.resumo) +
                '<p class="carregando">Telefone, e-mail e texto das mensagens estão mascarados.</p>' +
                '<pre>' + esc(r.payload || '(vazio)') + '</pre>';
            } catch (e) {
              corpo.innerHTML = '<p class="carregando">falhou: ' + esc(e.message) + '</p>';
            }
          });
        });

        // abre já no primeiro: a gaveta vazia não diz nada
        const primeiro = g.querySelector('.item');
        if (primeiro) primeiro.click();

        document.addEventListener('keydown', aoTeclar);
        g.querySelector('.fechar').focus();
      }

      function aoTeclar(ev) {
        if (ev.key === 'Escape') fecharGaveta();
      }

      function fecharGaveta() {
        if (!gavetaAberta) return;
        gavetaAberta.remove();
        gavetaAberta = null;
        document.removeEventListener('keydown', aoTeclar);
      }

      /**
       * Uma linha de evento que diz de quem é.
       *
       * "message_incoming / ignorado" é verdade e não serve: não dá para saber
       * se é lead novo ou conversa velha, de que board veio, nem se aquele lead
       * já foi tratado. Tudo isso já vinha no payload — faltava mostrar.
       */
      function linhaEvento(e) {
        const r = e.resumo || {};
        const nada = '<span class="nada">—</span>';

        const lead = r.quem
          ? esc(r.quem) + (r.telefone ? '<span class="sub">' + esc(r.telefone) + '</span>' : '')
          : (r.telefone ? '<span class="mono">' + esc(r.telefone) + '</span>' : nada);

        const tags = [];
        if (r.momento === 'lead novo') tags.push('<span class="tag tag-novo">lead novo</span>');
        else if (r.momento) tags.push('<span class="tag">em andamento</span>');
        if (r.origem === 'anuncio') tags.push('<span class="tag tag-anuncio">anúncio</span>');
        else if (r.origem === 'organico') tags.push('<span class="tag">orgânico</span>');

        // Marcada depois do webhook: o retrato guardado ainda mostra o card no
        // Orgânico, então a tag diz o que a ferramenta fez desde então.
        if (r.promovidoEm) tags.push('<span class="tag tag-novo">promovida ao funil</span>');

        const detalhe = [];
        if (r.conversaId) detalhe.push('conversa ' + r.conversaId);
        if (r.idadeConversa !== null && r.idadeConversa !== undefined) detalhe.push('aberta há ' + duracao(r.idadeConversa));
        if (r.conversaEnviada) detalhe.push('conversão já enviada');

        const conversa = (tags.join(' ') || nada) +
          (detalhe.length ? '<span class="sub">' + esc(detalhe.join(' · ')) + '</span>' : '');

        // O card mostrado e' o do momento do webhook. Depois da promocao ele
        // mudou de board, e dizer "Organico" ao lado de "promovida" seria mentira.
        const card = r.promovidoEm
          ? '<span class="tag tag-anuncio">movido</span>' +
            (r.board ? '<span class="sub">estava em ' + esc(r.board) + '</span>' : '')
          : r.board
            ? esc(r.board) + (r.etapa ? '<span class="sub">' + esc(r.etapa) + '</span>' : '')
            : nada;

        return `
          <tr class="clicavel" data-ev="${e.id}">
            <td title="${esc(hora(e.received_at))}">${haQuanto(e.received_at)}</td>
            <td>${esc(e.pipeline || e.event_type)}<span class="sub">${esc(e.source)} · ${esc(e.event_type)}${r.autor ? ' · ' + esc(r.autor) : ''}</span></td>
            <td>${lead}</td>
            <td>${conversa}</td>
            <td class="esconder-mobile">${card}</td>
            <td class="st-${esc(e.status)}">${esc(e.status)}</td>
            <td class="motivo esconder-mobile">${esc(e.motivo || '')}</td>
            <td>${e.signature_ok === null ? '—' : e.signature_ok ? 'ok' : 'falhou'}</td>
          </tr>`;
      }

      /** De quem e' este webhook, acima do json — para nao ter que garimpar. */
      function cabecalhoResumo(r) {
        if (!r) return '';
        const campos = [
          ['Lead', r.quem],
          ['Telefone', r.telefone],
          ['Conversa', r.conversaId],
          ['Inbox', r.inbox],
          ['Card', r.board && r.etapa ? r.board + ' › ' + r.etapa : r.board],
          ['Protocolo', r.protocolo],
          ['Origem', r.origem],
          ['Momento', r.momento],
          ['Aberta há', r.idadeConversa === null || r.idadeConversa === undefined ? null : duracao(r.idadeConversa)],
          ['Etiquetas', (r.etiquetas || []).join(', ')],
        ].filter(function (c) { return c[1] !== null && c[1] !== undefined && c[1] !== ''; });

        if (!campos.length) return '';
        return '<dl class="resumo">' + campos
          .map(function (c) { return '<dt>' + esc(c[0]) + '</dt><dd>' + esc(String(c[1])) + '</dd>'; })
          .join('') + '</dl>';
      }

      function duracao(seg) {
        if (seg < 60) return seg + 's';
        if (seg < 3600) return Math.round(seg / 60) + ' min';
        if (seg < 86400) return Math.round(seg / 3600) + ' h';
        return Math.round(seg / 86400) + ' d';
      }

      async function verPayload(tenantId, eventId, revelar) {
        const secao = document.getElementById('secao-payload');
        const pre = document.getElementById('payload');
        const aviso = document.getElementById('payload-aviso');
        const botao = document.getElementById('btn-revelar');

        secao.hidden = false;
        // o corpo do webhook fica na aba Atividade; se o clique veio de outra,
        // mostrar o painel sem trocar de aba deixaria a tela em branco
        const painel = secao.closest('.painel');
        if (painel && painel.hidden) {
          const b = document.querySelector('.aba[data-aba="' + painel.dataset.painel + '"]');
          if (b) b.click();
        }
        pre.textContent = 'carregando…';
        secao.scrollIntoView({ behavior: 'smooth', block: 'start' });

        const r = await api(
          '/tenants/' + tenantId + '/events/' + eventId + '/payload' + (revelar ? '?revelar=1' : ''),
        );

        pre.textContent = r.payload || '(vazio)';
        document.getElementById('payload-quem').innerHTML = cabecalhoResumo(r.resumo);
        if (r.expirado) {
          aviso.textContent = r.motivo;
          botao.hidden = true;
        } else {
          aviso.textContent = r.mascarado
            ? 'Telefone, e-mail e texto das mensagens estão mascarados.'
            : 'Mostrando os dados originais do lead.';
          botao.hidden = false;
          botao.textContent = r.mascarado ? 'Revelar dados originais' : 'Voltar a mascarar';
          botao.onclick = () => verPayload(tenantId, eventId, !!r.mascarado);
        }
      }

      async function enviar(caminho, metodo, corpo) {
        let r;
        try {
          r = await fetch('/api' + caminho, {
            method: metodo,
            headers: { 'content-type': 'application/json' },
            body: corpo === undefined ? undefined : JSON.stringify(corpo),
          });
        } catch {
          // mesma causa do api(): sessao do Access vencida vira TypeError seco
          throw new Error('sessão expirou — recarregue a página (F5)');
        }
        if (r.redirected || /cloudflareaccess\.com/.test(r.url)) {
          throw new Error('sessão expirou — recarregue a página (F5)');
        }
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
        return j;
      }

      function normalizarSlug(v) {
        return String(v || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function opcoes(lista, valorAtual) {
        return lista
          .map(function (o) { return '<option ' + (o === valorAtual ? 'selected' : '') + '>' + o + '</option>'; })
          .join('');
      }

      async function carregarInstancias(id) {
        const alvo = document.getElementById('instancias');
